<script>
/* =========================================================================
 * 成长空间 · 首页
 * -------------------------------------------------------------------------
 * 这一版首页的主线不是课程，是四件事：
 *   看见自己 → 留一句话 → 看见变化 → 知道下一步能去哪
 * 所以第一屏最重要的入口是「最近的你，还好吗？」（15 题），
 * 而不是任何一节课程。课程只在用户自己产生需求之后才出现。
 *
 * 侧栏三块（今日小记 / 我的心情 / 近期学习）在手机上没有右栏，
 * 会以内联卡片出现在正文末尾 —— 同一份 HTML、同一个绑定函数，
 * 只渲染两遍，不维护两份代码。
 * ========================================================================= */
(function () {
  "use strict";

  /* ---------------------------------------------------------------------
   * 侧栏三块
   * ------------------------------------------------------------------- */
  function sideHtml() {
    var h = [];
    var today = Store.todayEntry("note");
    var moodToday = Store.todayEntry("mood");
    var curMood = moodToday && moodToday.meta ? moodToday.meta.moodId : "";
    var series = Store.moodSeries(14);
    var hasMood = false;
    for (var k = 0; k < series.length; k++) if (series[k].score) hasMood = true;
    var curve = hasMood ? Widgets.moodSvg(series) : "";

    /* 今日小记 */
    h.push('<div class="rail-card note-box">');
    h.push("<h4>" + UI.icon("pen", 15) + "今日小记</h4>");
    h.push('<textarea data-field="dailyNote" placeholder="今天有什么想留下的？一句就好。">' +
      UI.esc(today ? today.note : "") + "</textarea>");
    h.push('<div class="note-foot">' +
      '<span class="note-hint">' +
      (today ? "今天已记下 · " + UI.friendlyTime(today.ts) : "只存在你自己的浏览器里") +
      "</span>" +
      '<button class="btn ghost" data-save-note="1" type="button">保存</button>' +
      "</div>");
    h.push("</div>");

    /* 我的心情 */
    h.push('<div class="rail-card">');
    h.push("<h4>" + UI.icon("heart", 15) + "我的心情</h4>");
    if (curve) {
      h.push('<div class="mood-wrap">' + curve + "</div>" + Widgets.moodAxis(series));
    } else {
      h.push('<div class="mood-empty">还没有记录。<br>选一个此刻最接近的，曲线会从这里开始。</div>');
    }
    h.push('<div class="mood-pick">');
    for (var i = 0; i < Widgets.MOODS.length; i++) {
      var m = Widgets.MOODS[i];
      h.push('<button class="mood-btn' + (m.id === curMood ? " on" : "") + '"' +
        ' data-mood="' + m.id + '" type="button"' +
        ' aria-label="' + m.label + '" title="' + m.label + '">' +
        UI.icon(m.icon, 22) + "<span>" + m.short + "</span></button>");
    }
    h.push("</div>");
    h.push('<p class="rail-note">' + (hasMood ? "近 14 天。没有记录的日子会断开，不连线。" : "不是打分，只是给此刻的自己留个标记。") + "</p>");
    h.push("</div>");

    /* 近期学习 */
    var st = Store.stats();
    var pct = st.coursesTotal ? Math.round(st.coursesDone / st.coursesTotal * 100) : 0;
    var nextId = Store.nextCourseId();
    var next = nextId && window.Course ? Course.byId(nextId) : null;
    h.push('<div class="rail-card">');
    h.push("<h4>" + UI.icon("book", 15) + "近期学习</h4>");
    h.push('<div class="bar"><i style="width:' + pct + '%"></i></div>');
    h.push('<p class="rail-note">已走过 ' + st.coursesDone + " / " + st.coursesTotal +
      " 节 · 连续 " + st.streak + " 天</p>");
    /* 右栏只有 262px，容不下收藏星标 —— 收藏在「探索」页里做，
       这里只留一条「接着去哪」的线索 */
    h.push(next ? Widgets.lessonRow(next, { showFav: false }) : '<p class="rail-quiet">五节都走完了。<br>新的方向正在展开。</p>');
    h.push("</div>");

    return h.join("");
  }

  function bindSide(root) {
    /* 今日小记：只写当天的同一条，改主意重写不会留下两条 */
    var btn = UI.$("[data-save-note]", root);
    var ta = UI.$('[data-field="dailyNote"]', root);
    if (btn && ta) {
      btn.addEventListener("click", function () {
        var txt = ta.value.replace(/^\s+|\s+$/g, "");
        if (!txt) { UI.toast("写一句就好"); ta.focus(); return; }
        Store.saveDailyNote(txt);
        UI.toast("已经记下了");
        Router.render("home", {});
      });
    }

    /* 心情：点一下即存，立刻重绘曲线 */
    var moodBtns = UI.$all("[data-mood]", root);
    for (var i = 0; i < moodBtns.length; i++) (function (b) {
      b.addEventListener("click", function () {
        var m = Widgets.moodById(b.getAttribute("data-mood"));
        if (!m) return;
        var again = Store.todayEntry("mood") && Store.todayEntry("mood").meta.moodId === m.id;
        Store.saveMood(m.id, m.score, m.label);
        UI.toast(again ? "今天的心情改好了" : "记下了：" + m.label);
        Router.render("home", {});
      });
    })(moodBtns[i]);

    Widgets.bindLessonRows(root);
    Widgets.bindFav(root);
  }

  /* ---------------------------------------------------------------------
   * 正文
   * ------------------------------------------------------------------- */
  function render() {
    var p = Store.getProfile() || {};
    var nick = p.nickname || "";
    var first = Store.firstRecord();
    var st = Store.stats();
    var h = [];

    /* 问候 */
    h.push('<div class="home-head">' +
      "<div><h1>" + (nick ? "你好，" + UI.esc(nick) : "你好") + "</h1>" +
      '<p class="sub">每一次的停留，都是在靠近更真实的自己。</p></div>' +
      '<div class="home-date"><b>' + UI.dotDate(UI.today()) + "</b>" +
      UI.weekday(UI.today()) + "</div>" +
      "</div>");

    /* 15 题入口 —— 首页最重要的一块 */
    h.push('<div class="invite' + (first ? " done" : "") + '">' +
      '<span class="inv-art" aria-hidden="true"></span><div class="invite-inner">');
    if (!first) {
      h.push('<p class="inv-kicker">第一次认识自己</p>');
      h.push("<h2>" + UI.esc(QUESTIONNAIRE.intro.title) + "</h2>");
      h.push('<p class="inv-sub">' + UI.esc(QUESTIONNAIRE.intro.subtitle) + "</p>");
      h.push('<p class="inv-note">' + UI.textLines(QUESTIONNAIRE.intro.note) + "</p>");
      h.push('<p class="inv-meta">' + UI.esc(QUESTIONNAIRE.intro.meta) + "</p>");
      h.push('<button class="btn primary" data-go="questionnaire" type="button">' +
        "开始探索 " + UI.icon("arrow", 17) + "</button>");
    } else {
      h.push('<p class="inv-kicker">你已经留下了</p>');
      h.push("<h2>" + UI.esc(first.note || "第一次认识自己") + "</h2>");
      h.push('<p class="inv-sub">' + UI.esc(first.meta && first.meta.record ? first.meta.record.quote : "") + "</p>");
      h.push('<p class="inv-meta">' + UI.dotDate(first.date) + " 写下 · 那时候的你</p>");
      h.push('<button class="btn ghost" data-record="' + first.id + '" type="button">' +
        "回看这一份 " + UI.icon("arrow", 17) + "</button>");
      h.push('<p class="inv-note">想重新认识一次，也可以再来一遍。</p>');
      h.push('<button class="link small" data-go="questionnaire" type="button">重新做一次 →</button>');
    }
    h.push("</div></div>");

    /* 最近的成长记录 */
    /* maxMood:2 —— 摘要里最多两条心情，其余位置让给小记、课程、画像。
       心情是背景，不是「我做过的事」；「成长轨迹」页仍是完整的。
       见 store.js timelineItems 上的说明。 */
    var items = Store.timelineItems(8, { maxMood: 2 });
    h.push('<div class="sec-head"><h2>最近的成长记录</h2>' +
      (items.length ? '<button class="link small" data-go="trace" type="button">全部 →</button>' : "") +
      "</div>");
    if (!items.length) {
      h.push('<div class="empty">' + UI.icon("sprout", 30) +
        "<b>这里还很安静</b>" +
        "<p>完成一次认识自己，或者写一句今天的自己，<br>你的轨迹就会从这里长出来。</p>" +
        '<button class="btn ghost" data-go="notes" type="button">去看看记录</button>' +
        /* 空白页最劝退的是「不知道该拿它干嘛」。给一条能立刻看到
           用起来是什么样子的路 —— 数据是假的，但页面是真的。 */
        '<p class="empty-alt">还不确定的话，' +
        '<button class="link small" data-demo="1" type="button">先看看示例</button></p>' +
        "</div>");
    } else {
      h.push(Widgets.timeline(items, { layout: "h" }));
    }

    /* 此刻可以探索的方向 */
    h.push('<div class="sec-head"><h2>' + UI.esc(TOPICS.heading) + "</h2></div>");
    h.push('<p class="sec-note">' + UI.esc(TOPICS.sub) + "</p>");
    h.push('<div class="topic-grid">');
    var explored = Store.settings().explored;
    for (var i = 0; i < TOPICS.list.length; i++) {
      var t = TOPICS.list[i];
      var seen = explored.indexOf(t.id) !== -1;
      h.push('<button class="topic-card' + (seen ? " seen" : "") + '"' +
        ' data-topic="' + t.id + '" type="button">' +
        '<span class="tc-ic">' + UI.icon(t.icon, 22) + "</span>" +
        "<b>" + UI.esc(t.name) + "</b>" +
        '<span class="tc-sub">' + (seen ? "看过了" : "点进去看看") + "</span>" +
        "</button>");
    }
    h.push("</div>");

    /* 收尾：不催促，只说明 */
    h.push('<div class="rail-quiet">成长不是一条要赶完的路。<br>今天只走了一小步，也算数。</div>');

    /* 手机端没有右栏，把侧栏内容内联在正文末尾；
       ≥1180px 时这段由 CSS 隐藏，改由 #rail2 显示 */
    h.push('<div class="rail-mobile">' + sideHtml() + "</div>");

    return h.join("");
  }

  function bind(viewEl) {
    Widgets.bindGo(viewEl);
    bindSide(UI.$(".rail-mobile", viewEl) || viewEl);
  }

  /* 宽屏右栏：同一份 sideHtml() */
  function rail() {
    return '<div class="rail-inline">' + sideHtml() + "</div>";
  }
  function bindRail(railEl) { bindSide(railEl); }

  window.Pages = window.Pages || {};
  window.Pages.home = {
    title: "首页",
    render: render, bind: bind,
    rail: rail, bindRail: bindRail
  };
})();
</script>
<script>
/* =========================================================================
 * 成长空间 · 成长轨迹
 * -------------------------------------------------------------------------
 * 这里只做一件事：把用户做过的事，按时间摆出来。
 * 不打分、不排名、不显示「进步了多少」——只让他看见自己确实走过。
 * 手机端固定纵向：横向时间轴在 <900px 时由 CSS 折成纵向，DOM 只有一份。
 * ========================================================================= */
(function () {
  "use strict";
  window.Pages = window.Pages || {};

  function statsLine(st) {
    var bits = [];
    if (st.recordCount) bits.push(st.recordCount + " 条记录");
    if (st.noteDays) bits.push(st.noteDays + " 天写过小记");
    if (st.streak > 1) bits.push("连续 " + st.streak + " 天");
    return bits.join(" · ");
  }

  function render() {
    var items = Store.timelineItems(0);
    var st = Store.stats();
    var h = [];

    if (!items.length) {
      h.push('<p class="page-intro">你走过的每一步，都会留在这里。</p>');
      h.push('<div class="empty">' + UI.icon("path", 32) +
        "<b>轨迹还没有开始</b>" +
        "<p>做完「第一次认识自己」，或者写下今天的一句话，<br>第一个节点就会出现在这里。</p>" +
        '<button class="btn primary" data-go="questionnaire" type="button">开始探索</button>' +
        '<p class="small" style="margin-top:12px">或者 <button class="link small" data-go="notes" type="button">先写一句今天的自己</button></p>' +
        "</div>");
      return h.join("");
    }

    var line = statsLine(st);
    h.push('<p class="page-intro">你走过的每一步，都在这里。' +
      (line ? '<br><span class="muted small">' + UI.esc(line) + "</span>" : "") + "</p>");
    h.push(Widgets.timeline(items, { layout: "v" }));
    h.push('<div class="rail-quiet">往前翻，看见的是自己走过的路。<br>不需要和谁比较。</div>');
    return h.join("");
  }

  function bind(v) { Widgets.bindGo(v); }

  /* 宽屏右栏：只读的概览，不重复正文 */
  function rail() {
    var st = Store.stats();
    var h = [];
    h.push('<div class="rail-card">');
    h.push("<h4>" + UI.icon("path", 15) + "这一路</h4>");
    h.push('<div class="statrow">' +
      '<div class="stat"><b>' + st.recordCount + "</b><span>条记录</span></div>" +
      '<div class="stat"><b>' + st.noteDays + "</b><span>天小记</span></div>" +
      '<div class="stat"><b>' + st.streak + "</b><span>连续天数</span></div>" +
      "</div>");
    h.push("</div>");

    /* 第一条《第一次认识自己》单独拎出来 —— 它是整条轨迹的起点。
       不能拿 timelineItems 的末项充数：末项只是最老的一条，不一定是它。 */
    var all = Store.timelineItems(0), start = null;
    for (var i = 0; i < all.length; i++) {
      if (all[i].kind === "assessment" && all[i].refId) { start = all[i]; break; }
    }
    if (start) {
      h.push('<div class="rail-card">');
      h.push("<h4>" + UI.icon("sprout", 15) + "最开始的那次</h4>");
      h.push(Widgets.timeline([start], { layout: "v" }));
      h.push("</div>");
    }
    return h.join("");
  }

  function bindRail(el) { Widgets.bindGo(el); }

  window.Pages.trace = {
    title: "成长轨迹",
    render: render, bind: bind,
    rail: rail, bindRail: bindRail
  };
})();
</script>
<script>
/* =========================================================================
 * 成长空间 · 记录
 * -------------------------------------------------------------------------
 * 首页的「今日小记 / 我的心情」是随手入口，这里是它们真正的主场：
 * 今天可以改、可以重写，往下翻能看到全部记录。
 *
 * 所有内容都写进 gs.journal（按时序追加的行为流），
 * 所以小记和心情会自动计入连续天数 —— 它们本来就是成长活动。
 * ========================================================================= */
(function () {
  "use strict";
  window.Pages = window.Pages || {};

  var KIND = {
    assessment: { icon: "sprout", label: "认识自己" },
    course: { icon: "book", label: "课程" },
    practice: { icon: "pen", label: "练习" },
    note: { icon: "pen", label: "小记" },
    mood: { icon: "heart", label: "心情" }
  };

  function kindOf(t) { return KIND[t] || { icon: "pen", label: "记录" }; }

  /* journal 条目 -> 列表行 */
  function entryRow(e) {
    var k = kindOf(e.type);
    var title, sub;

    if (e.type === "assessment") {
      title = e.note || "认识自己";
      sub = e.meta && e.meta.record ? e.meta.record.quote : "";
    } else if (e.type === "mood") {
      title = e.meta && e.meta.label ? "心情 · " + e.meta.label : "记录了一次心情";
      sub = "";
    } else if (e.type === "note") {
      title = e.note || "今日小记";
      sub = "";
    } else {
      title = e.note || k.label;
      var rs = (e.meta && e.meta.reflections) || [];
      sub = "";
      for (var i = 0; i < rs.length; i++) if (rs[i] && rs[i].a) { sub = rs[i].a; break; }
    }

    var openable = e.type === "assessment" && e.meta && e.meta.kind === "first-self";
    return '<div class="rec-item k-' + UI.esc(e.type) + '"' +
      (openable ? ' data-record="' + e.id + '" role="button" tabindex="0"' : "") + ">" +
      '<span class="ri-ic">' + UI.icon(k.icon, 17) + "</span>" +
      '<div class="ri-body">' +
      '<span class="when">' + UI.esc(UI.dotDate(e.date)) + " · " + UI.esc(UI.weekday(e.date)) + "</span>" +
      "<b>" + UI.esc(title) + "</b>" +
      (sub ? "<p>" + UI.esc(sub) + "</p>" : "") +
      "</div>" +
      (openable ? '<span class="lr-cta">' + UI.icon("chevron", 14) + "</span>" : "") +
      "</div>";
  }

  /* 全部记录（新的在前），按日期分组 */
  function listHtml() {
    var j = Store.journal();
    if (!j.length) {
      return '<div class="empty">' + UI.icon("pen", 30) +
        "<b>还没有任何记录</b>" +
        "<p>上面写一句、选一个心情，<br>这里就会出现第一条。</p></div>";
    }
    var h = [], lastDate = "";
    for (var i = j.length - 1; i >= 0; i--) {
      var e = j[i];
      if (e.date !== lastDate) {
        var gap = lastDate ? " style=\"margin-top:18px\"" : "";
        h.push('<div class="label" ' + gap + ">" + UI.esc(UI.friendlyDate(e.date)) + "</div>");
        lastDate = e.date;
      }
      h.push(entryRow(e));
    }
    return h.join("");
  }

  /* ---------------------------------------------------------------------
   * 今日：小记 + 心情（和首页是同一套交互，只是这里可以慢慢改）
   * ------------------------------------------------------------------- */
  function todayHtml() {
    var note = Store.todayEntry("note");
    var mood = Store.todayEntry("mood");
    var curId = mood && mood.meta ? mood.meta.moodId : "";
    var series = Store.moodSeries(14);
    var hasMood = false;
    for (var k = 0; k < series.length; k++) if (series[k].score) hasMood = true;
    var curve = hasMood ? Widgets.moodSvg(series) : "";
    var h = [];

    h.push('<div class="card note-box">');
    h.push('<div class="card-head"><h3>今日小记</h3>' +
      '<span class="small muted">' + UI.esc(UI.dotDate(UI.today())) + " " + UI.esc(UI.weekday(UI.today())) + "</span></div>");
    h.push('<p class="small muted" style="margin:0 0 8px">想到什么写什么。写下的东西只有你自己看得到。</p>');
    h.push('<textarea data-field="dailyNote" placeholder="今天有什么想留下的？一句就好。">' +
      UI.esc(note ? note.note : "") + "</textarea>");
    h.push('<div class="note-foot">' +
      '<span class="note-hint">' + (note ? "上次记于 " + UI.friendlyTime(note.ts) : "今天还没写") + "</span>" +
      '<button class="btn ghost" data-save-note="1" type="button">保存</button></div>');
    h.push("</div>");

    h.push('<div class="card">');
    h.push('<div class="card-head"><h3>我的心情</h3><span class="small muted">近 14 天</span></div>');
    if (curve) {
      h.push('<div class="mood-wrap">' + curve + "</div>" + Widgets.moodAxis(series));
    } else {
      h.push('<div class="mood-empty">还没有记录。<br>选一个此刻最接近的，曲线会从这里开始。</div>');
    }
    h.push('<div class="mood-pick">');
    for (var i = 0; i < Widgets.MOODS.length; i++) {
      var m = Widgets.MOODS[i];
      h.push('<button class="mood-btn' + (m.id === curId ? " on" : "") + '" data-mood="' + m.id + '" type="button"' +
        ' aria-label="' + m.label + '" title="' + m.label + '">' +
        UI.icon(m.icon, 22) + "<span>" + m.label + "</span></button>");
    }
    h.push("</div>");
    h.push('<p class="small muted" style="margin:10px 0 0">这不是打分。只是给此刻的自己留一个标记。</p>');
    h.push("</div>");

    return h.join("");
  }

  function render() {
    return todayHtml() +
      '<div class="sec-head"><h2>全部记录</h2><span class="small muted">' +
      Store.stats().recordCount + " 条</span></div>" +
      listHtml();
  }

  function bind(v) {
    var btn = UI.$("[data-save-note]", v);
    var ta = UI.$('[data-field="dailyNote"]', v);
    if (btn && ta) {
      btn.addEventListener("click", function () {
        var txt = ta.value.replace(/^\s+|\s+$/g, "");
        if (!txt) { UI.toast("写一句就好"); ta.focus(); return; }
        Store.saveDailyNote(txt);
        UI.toast("已经记下了");
        Router.render("notes", {});
      });
    }

    var moodBtns = UI.$all("[data-mood]", v);
    for (var i = 0; i < moodBtns.length; i++) (function (b) {
      b.addEventListener("click", function () {
        var m = Widgets.moodById(b.getAttribute("data-mood"));
        if (!m) return;
        Store.saveMood(m.id, m.score, m.label);
        UI.toast("记下了：" + m.label);
        Router.render("notes", {});
      });
    })(moodBtns[i]);

    Widgets.bindGo(v);
  }

  function rail() {
    var st = Store.stats();
    return '<div class="rail-card">' +
      "<h4>" + UI.icon("pen", 15) + "记录概览</h4>" +
      '<div class="statrow">' +
      '<div class="stat"><b>' + st.recordCount + "</b><span>条记录</span></div>" +
      '<div class="stat"><b>' + st.noteDays + "</b><span>天小记</span></div>" +
      /* 这里原本显示近 30 天心情均值（3.1 这种数字）。
         一个带小数点的分数，会让人立刻开始比较「这个月是不是比上个月好」——
         那正是这套东西不该制造的焦虑。曲线已经把起伏画出来了，
         所以这里只数次数，不给分。 */
      '<div class="stat"><b>' + st.moodDays30 + "</b><span>天记了心情</span></div>" +
      "</div>" +
      '<p class="rail-note">只是数一数，不是打分。<br>心情的起伏，交给上面那条曲线说。</p>' +
      "</div>";
  }

  window.Pages.notes = {
    title: "记录",
    render: render, bind: bind,
    rail: rail, bindRail: function () {}
  };
})();
</script>
<script>
/* =========================================================================
 * 成长空间 · 探索
 * -------------------------------------------------------------------------
 * 三块内容自上而下，从「此刻的我」走到「可以去的方向」：
 *   1. 需求入口   —— 用户带着一个具体感受来，先被听见，再谈下一步
 *   2. 9 区地图   —— 长期的方向感，双层体系里的上层（4 大门类仍在准备）
 *   3. 轻量课程   —— 用户自己产生需求之后的下一步，不是入口的终点
 *
 * 入口文案刻意不出现任何医学判断、人格类型、觉醒等级。
 * ========================================================================= */
(function () {
  "use strict";
  window.Pages = window.Pages || {};

  function render() {
    var st = Store.stats();
    var explored = Store.settings().explored;
    var h = [];

    /* ---- 1. 需求入口 ----
       下面两块都有 sec-head，这一块原本只有一行副标题，
       卡片就直接贴上来了，读起来像页面开头漏了个标题。 */
    h.push('<div class="sec-head"><h2>' + UI.esc(TOPICS.heading) + "</h2></div>");
    h.push('<p class="sec-note">' + UI.esc(TOPICS.sub) + "</p>");
    h.push('<div class="topic-grid">');
    for (var i = 0; i < TOPICS.list.length; i++) {
      var t = TOPICS.list[i];
      var seen = explored.indexOf(t.id) !== -1;
      h.push('<button class="topic-card' + (seen ? " seen" : "") + '" data-topic="' + t.id + '" type="button">' +
        '<span class="tc-ic">' + UI.icon(t.icon, 22) + "</span>" +
        "<b>" + UI.esc(t.name) + "</b>" +
        '<span class="tc-sub">' + (seen ? "看过了" : "点进去看看") + "</span>" +
        "</button>");
    }
    h.push("</div>");

    /* ---- 2. 9 区地图 ---- */
    h.push('<div class="sec-head"><h2>九个成长方向</h2>' +
      '<span class="small muted">' + st.coursesDone + " / " + st.coursesTotal + " 节</span></div>");
    h.push('<p class="sec-note">第一阶段先专注中央区。其余方向正在准备，会陆续开放。</p>');
    h.push(ZoneMap.html());

    /* ---- 3. 轻量课程 ---- */
    h.push('<div class="sec-head"><h2>可以开始的课</h2>' +
      '<span class="small muted">' + st.coursesDone + " / " + st.coursesTotal + "</span></div>");
    if (st.favCount) {
      h.push('<p class="sec-note">收藏了 ' + st.favCount + " 节，在最上面。带 ★ 的就是。</p>");
    }
    h.push(Widgets.lessonList(orderedCourseIds()));

    h.push('<div class="coming-card"><p><b>还有更多方向在准备中</b></p>' +
      '<p class="muted small">不用急着全部走完。先挑一个此刻最想看的，就很好了。</p></div>');

    h.push('<p class="small muted" style="margin:16px 2px 0;line-height:1.8">' +
      UI.esc(TOPICS.footNote) + "</p>");

    return h.join("");
  }

  /* 收藏的课排前面，其余保持原顺序 */
  function orderedCourseIds() {
    var cs = window.COURSES || [], favs = Store.favorites(), out = [], i;
    for (i = 0; i < cs.length; i++) if (favs.indexOf(cs[i].id) !== -1) out.push(cs[i].id);
    for (i = 0; i < cs.length; i++) if (out.indexOf(cs[i].id) === -1) out.push(cs[i].id);
    return out;
  }

  function bind(v) {
    ZoneMap.bind(v);
    Widgets.bindGo(v);
    Widgets.bindLessonRows(v);
    Widgets.bindFav(v, function () { Router.render("explore", {}); });
  }

  /* 右栏：收藏。空的时候不放空卡片，直接给一句话。 */
  function rail() {
    var favs = Store.favorites();
    var h = [];
    h.push('<div class="rail-card">');
    h.push("<h4>" + UI.icon("star", 15) + "我收藏的</h4>");
    if (!favs.length) {
      h.push('<p class="rail-note">还没有收藏。课程行右边的星星，点一下就会出现在这里。</p>');
    } else {
      h.push(Widgets.lessonList(favs));
    }
    h.push("</div>");

    h.push('<div class="rail-card">');
    h.push("<h4>" + UI.icon("compass", 15) + "看过哪些方向</h4>");
    var explored = Store.settings().explored;
    h.push('<p class="rail-note">' +
      (explored.length ? explored.length + " / " + TOPICS.list.length + " 个入口看过了" :
        "还没有点开过任何入口。") + "</p>");
    h.push("</div>");
    return h.join("");
  }

  function bindRail(el) {
    Widgets.bindLessonRows(el);
    Widgets.bindFav(el, function () { Router.render("explore", {}); });
  }

  window.Pages.explore = {
    title: "探索",
    render: render, bind: bind,
    rail: rail, bindRail: bindRail
  };
})();
</script>
<script>
/* =========================================================================
 * 成长空间 · 我的
 * -------------------------------------------------------------------------
 * 三件事：我是谁（昵称）+ 我留下了什么（画像与统计）+ 我能改什么（设置）。
 *
 * 老用户兼容：v1 是 5 题量表的画像（{state, focus, recommendIds}），
 * v2 是 15 题生成的《第一次认识自己》（{sections, quote}）。
 * 两种都在这里能正常显示，老数据【只读保留、绝不主动清空】，
 * 只给一句软提示问要不要用新的 15 题更新一次。
 * ========================================================================= */
(function () {
  "use strict";
  window.Pages = window.Pages || {};

  /* ---- v2 画像：分段正文 ---- */
  function v2Html(rec) {
    var h = ['<div class="card">'];
    h.push('<div class="card-head"><h3>' + UI.esc(rec.title || "第一次认识自己") + "</h3>" +
      '<span class="tag live">15 题版</span></div>');
    if (rec.quote) h.push('<p class="small muted" style="margin:0 0 4px">' + UI.esc(rec.quote) + "</p>");
    var secs = rec.sections || [];
    for (var i = 0; i < secs.length; i++) {
      h.push('<div class="rec-sec"><h3>' + UI.esc(secs[i].label) + "</h3>" +
        "<p>" + UI.textLines(secs[i].text) + "</p></div>");
    }
    h.push("</div>");
    return h.join("");
  }

  /* ---- v1 画像：老的 5 题结果，只读 ---- */
  function v1Html(pf) {
    var h = ['<div class="card">'];
    h.push('<div class="card-head"><h3>你的状态画像</h3><span class="tag">早先做过的一次</span></div>');
    if (pf.state) h.push('<p class="state-text">' + UI.textLines(pf.state) + "</p>");
    if (pf.focus && pf.focus.length) {
      h.push('<div class="focus-label">当时留意到的方向</div>');
      for (var i = 0; i < pf.focus.length; i++) {
        h.push('<div class="focus-item">· ' + UI.esc(pf.focus[i]) + "</div>");
      }
    }
    h.push('<p class="small muted" style="margin-top:12px">' +
      "这一份是早先那版留下的，会一直给你保留着，不会被覆盖掉。</p>");
    h.push("</div>");
    return h.join("");
  }

  function portraitHtml() {
    var p = Store.getProfile();
    if (!p || !p.portrait) {
      return '<div class="empty">' + UI.icon("sprout", 30) +
        "<b>还没有认识过自己</b>" +
        "<p>用 15 个问题，花几分钟看看现在的自己。<br>写下来的东西只会留在你的浏览器里。</p>" +
        '<button class="btn primary" data-go="questionnaire" type="button">开始探索</button></div>';
    }
    var rec = p.portrait;
    return rec.sections ? v2Html(rec) : v1Html(rec);
  }

  function render() {
    var p = Store.getProfile() || {};
    var st = Store.stats();
    var nick = p.nickname || "";
    var v = Store.answersVersion();
    var h = [];

    /* 头部 */
    h.push('<div class="me-head">' +
      '<div class="me-avatar">' + UI.esc(nick ? nick.charAt(0) : "你") + "</div>" +
      "<div><h1>" + (nick ? UI.esc(nick) : "还没有起名字") + "</h1>" +
      '<p class="sub">' + (st.hasFirstRecord ? "你已经认真看过自己一次了。" : "慢慢来，不着急。") + "</p>" +
      "</div></div>");

    /* 统计 */
    h.push('<div class="statgrid">' +
      '<div class="stat"><b>' + st.recordCount + "</b><span>条记录</span></div>" +
      '<div class="stat"><b>' + st.noteDays + "</b><span>天小记</span></div>" +
      '<div class="stat"><b>' + st.streak + "</b><span>连续天数</span></div>" +
      '<div class="stat"><b>' + st.favCount + "</b><span>收藏</span></div>" +
      "</div>");

    /* 画像 */
    h.push('<div class="sec-head"><h2>我的画像</h2></div>');
    h.push(portraitHtml());

    /* 老数据软提示：只问，不替换 */
    if (v === 1) {
      h.push('<div class="card" style="border-color:var(--brand-line)">' +
        "<h3>要不要用新的 15 题再认识一次？</h3>" +
        '<p class="small muted">新的版本会更贴近你此刻的状态。做完之后，上面那份旧的仍然会留着。</p>' +
        '<div class="btnrow"><button class="btn primary" data-go="questionnaire" type="button">重新认识一次</button></div>' +
        "</div>");
    } else if (v === 2) {
      h.push('<div class="btnrow"><button class="btn ghost" data-go="questionnaire" type="button">重新做一次</button></div>');
    }

    /* 收藏 */
    var favs = Store.favorites();
    if (favs.length) {
      h.push('<div class="sec-head"><h2>我收藏的课</h2></div>');
      h.push(Widgets.lessonList(favs));
    }

    /* 设置 */
    var s = Store.settings();
    h.push('<div class="sec-head"><h2>设置</h2></div>');
    h.push('<div class="card">');

    h.push('<div class="set-row"><div class="sr-label">昵称' +
      "<small>只用在问候里</small></div>" +
      '<button class="btn ghost" data-set-nick="1" type="button" style="min-height:38px;padding:0 16px;font-size:13.5px">修改</button></div>');

    h.push('<div class="set-row"><div class="sr-label">每天提醒我一下' +
      "<small>这个网页没有后台，做不到到点自己弹出来。<br>只能在你打开它的时候，温和地提一句。</small></div>" +
      '<button class="switch' + (s.remind.on ? " on" : "") + '" data-toggle-remind="1" type="button" ' +
      'role="switch" aria-checked="' + (s.remind.on ? "true" : "false") + '" ' +
      'aria-label="每天提醒我一下"></button></div>');

    h.push('<div class="set-row"><div class="sr-label">我用过的功能' +
      "<small>认识自己、小记、心情、收藏、探索入口</small></div>" +
      '<span class="sr-val">' + st.recordCount + " 条记录</span></div>");

    h.push("</div>");

    h.push('<div class="card">' +
      "<h3>关于数据</h3>" +
      '<p class="small muted">所有内容都只存在你这台设备的浏览器里。没有账号、不上传、不同步。' +
      "换一台设备或换一个浏览器，这里是空的。</p>" +
      '<div class="btnrow"><button class="btn ghost" data-reset="1" type="button">清空所有数据</button></div>' +
      "</div>");

    h.push('<div class="rail-quiet">成长空间 v7 · 纯本地运行<br>不是诊断工具，也不替代任何专业帮助。</div>');

    return h.join("");
  }

  function bind(v) {
    Widgets.bindGo(v);
    Widgets.bindLessonRows(v);
    Widgets.bindFav(v, function () { Router.render("me", {}); });

    var nick = UI.$("[data-set-nick]", v);
    if (nick) nick.addEventListener("click", function () {
      Router.navigate("nickname", { edit: 1 });
    });

    var sw = UI.$("[data-toggle-remind]", v);
    if (sw) sw.addEventListener("click", function () {
      var s = Store.settings();
      s.remind.on = !s.remind.on;
      Store.saveSettings(s);
      sw.classList.toggle("on", s.remind.on);
      sw.setAttribute("aria-checked", s.remind.on ? "true" : "false");
      UI.toast(s.remind.on ? "好，你打开它的时候我会提一句" : "已关闭");
    });

    var rst = UI.$("[data-reset]", v);
    if (rst) rst.addEventListener("click", function () {
      if (!window.confirm("会清空这台设备上的全部记录，且无法恢复。确定吗？")) return;
      Store.resetAll();
      UI.toast("已经清空了");
      Router.navigate("home", {});
    });
  }

  function rail() {
    var st = Store.stats();
    return '<div class="rail-card">' +
      "<h4>" + UI.icon("user", 15) + "这些数字" +
      "</h4>" +
      '<div class="statrow">' +
      '<div class="stat"><b>' + st.coursesDone + "</b><span>节课程</span></div>" +
      '<div class="stat"><b>' + st.practiceDone + "</b><span>次练习</span></div>" +
      '<div class="stat"><b>' + st.thisWeek + "</b><span>本周记录</span></div>" +
      "</div>" +
      '<p class="rail-note">数字只是痕迹，不是成绩。</p>' +
      "</div>";
  }

  window.Pages.me = {
    title: "我的",
    render: render, bind: bind,
    rail: rail, bindRail: function () {}
  };
})();
</script>
<script>
/* =========================================================================
 * 成长空间 · 15 题｜第一次认识自己
 * -------------------------------------------------------------------------
 * 一次一题，点选项就往下走。没有分数、没有等级、没有类型。
 *
 * 刻意的设计选择：
 *   - 进度用「03 / 15」和一条极细的线，不用粗百分比条 —— 粗条会把这件事
 *     变成「完成任务」，而它应该是「停下来看看自己」。
 *   - 选项不标对错，选完不立刻给反馈，不制造「答得好不好」的压力。
 *   - 最后两题可以留空直接跳过，跳过不等于失败。
 *   - 课程入口只在【完成之后】出现，而且只是「可以继续看的方向」，
 *     不是「你需要买课才能解决」。
 *
 * 答案里的 tone 是内部权重，只用于生成完成页那句温和的观察，绝不渲染。
 * ========================================================================= */
(function () {
  "use strict";
  window.Pages = window.Pages || {};

  var Q = null;                 /* QUESTIONNAIRE，延迟取，保证脚本顺序无关 */
  var S = { i: 0, answers: {}, rec: null };

  function qs() { return Q || (Q = window.QUESTIONNAIRE); }

  function reset() { S = { i: 0, answers: {}, rec: null }; }

  /* 维度 -> 一个可以继续看的需求入口。只是给个方向，不是结论。 */
  var DIM_TOPIC = {
    understand: "knowself",
    emotion: "anxiety",
    relation: "tired",
    action: "nothing",
    self: "irritable",
    thinking: "racing"
  };

  /* ---------------------------------------------------------------------
   * 答题页
   * ------------------------------------------------------------------- */
  function questionHtml() {
    var list = qs().questions, q = list[S.i];
    var h = [];

    h.push('<div class="q-flow">');
    /* 进度：细线 + 计数，两条都不带百分比数字 */
    h.push('<div class="q-bar"><i style="width:' + Math.round(S.i / list.length * 100) + '%"></i></div>');
    h.push('<p class="q-count">' + UI.courseNo(q.no) + " / " + list.length + "</p>");
    h.push('<p class="q-text">' + UI.esc(q.text) + "</p>");
    h.push('<p class="q-hint">' + (q.kind === "text" ? "可以写，也可以跳过。" : "选最接近现在的你就好，没有对错。") + "</p>");

    if (q.kind === "choice") {
      h.push('<div class="q-opts">');
      for (var i = 0; i < q.options.length; i++) {
        var o = q.options[i];
        var on = S.answers[q.key] === o.v;
        h.push('<button class="q-opt' + (on ? " on" : "") + '" data-pick="' + o.v + '" type="button">' +
          '<span class="q-key">' + o.v + "</span><span>" + UI.esc(o.text) + "</span></button>");
      }
      h.push("</div>");
    } else {
      h.push('<textarea class="q-text-input" data-field="free" placeholder="' +
        UI.esc(q.placeholder || "") + '">' + UI.esc(S.answers[q.key] || "") + "</textarea>");
    }

    h.push('<div class="q-nav">');
    h.push(S.i > 0
      ? '<button class="link" data-prev="1" type="button">‹ 上一题</button>'
      : "<span></span>");
    if (q.kind === "text") {
      h.push('<button class="btn primary" data-next="1" type="button">' +
        (S.i === list.length - 1 ? "写完了" : "下一题") + "</button>");
    } else if (S.answers[q.key]) {
      h.push('<button class="btn ghost" data-next="1" type="button">下一题</button>');
    } else {
      h.push("<span></span>");
    }
    h.push("</div>");

    h.push('<p class="small muted center" style="margin-top:18px">' +
      "这些回答只留在这台设备上，不会上传，也不会有人看到。</p>");
    h.push("</div>");
    return h.join("");
  }

  /* ---------------------------------------------------------------------
   * 完成页
   * ------------------------------------------------------------------- */
  function doneHtml() {
    var rec = S.rec, h = [];
    var top = rec.dims && rec.dims.length ? rec.dims[0] : null;
    var topic = top ? TOPICS.byId(DIM_TOPIC[top]) : null;

    h.push('<div class="q-flow">');
    h.push('<div class="done-head">' +
      '<div class="done-mark">' + UI.icon("sprout", 28) + "</div>" +
      "<h2>" + UI.esc(qs().done.title) + "</h2>" +
      "<p>" + UI.textLines(qs().done.subtitle) + "</p></div>");

    h.push('<div class="rec-sec quote" style="margin-top:20px">' +
      '<h3>此刻的你</h3><p>' + UI.textLines(window.Record.summary(rec)) + "</p></div>");

    h.push('<div class="card">' +
      '<p class="small muted" style="margin:0">你写下的这些，已经收进「记录」里，' +
      "也会成为「成长轨迹」的第一个节点。以后随时可以回来看。</p>" +
      '<div class="btnrow">' +
      '<button class="btn primary" data-open-record="' + UI.esc(rec.entryId || "") + '" type="button">看完整的一份</button>' +
      '<button class="btn ghost" data-go="trace" type="button">去成长轨迹</button>' +
      "</div></div>");

    if (topic) {
      h.push('<div class="sec-head"><h2>如果你想继续往前一步</h2></div>');
      h.push('<p class="sec-note">不是必须。只是如果你愿意，这里有一个方向。</p>');
      h.push('<button class="topic-card" data-topic="' + topic.id + '" type="button">' +
        '<span class="tc-ic">' + UI.icon(topic.icon, 22) + "</span>" +
        "<b>" + UI.esc(topic.name) + "</b>" +
        '<span class="tc-sub">' + UI.esc(topic.echo) + "</span></button>");
      h.push('<div style="margin-top:12px">' + Widgets.lessonList(topic.courses) + "</div>");
      h.push('<p class="small muted" style="margin:10px 2px 0;line-height:1.8">' +
        "今天不想做任何事，也完全可以。这一份记录已经留下了。</p>");
    }

    h.push('<div class="btnrow" style="margin-top:20px">' +
      '<button class="btn ghost" data-go="home" type="button">先回首页</button></div>');
    h.push("</div>");
    return h.join("");
  }

  function render() {
    return S.rec ? doneHtml() : questionHtml();
  }

  function bind(v) {
    if (S.rec) { bindDone(v); return; }
    bindQuestion(v);
  }

  function bindQuestion(v) {
    var list = qs().questions, q = list[S.i];

    var opts = UI.$all("[data-pick]", v);
    for (var i = 0; i < opts.length; i++) (function (b) {
      b.addEventListener("click", function () {
        S.answers[q.key] = b.getAttribute("data-pick");
        next();
      });
    })(opts[i]);

    var nxt = UI.$("[data-next]", v);
    if (nxt) nxt.addEventListener("click", function () {
      if (q.kind === "text") {
        var ta = UI.$('[data-field="free"]', v);
        S.answers[q.key] = ta ? ta.value.replace(/^\s+|\s+$/g, "") : "";
      }
      next();
    });

    var prv = UI.$("[data-prev]", v);
    if (prv) prv.addEventListener("click", function () {
      /* 回上一题时把当前这题的输入也保住，不然回头一看白写了 */
      if (q.kind === "text") {
        var ta2 = UI.$('[data-field="free"]', v);
        if (ta2) S.answers[q.key] = ta2.value.replace(/^\s+|\s+$/g, "");
      }
      S.i = Math.max(0, S.i - 1);
      Router.render("questionnaire", {});
    });
  }

  function next() {
    var list = qs().questions;
    if (S.i < list.length - 1) {
      S.i++;
      Router.render("questionnaire", {});
      return;
    }
    /* 最后一题：生成记录。
       注意顺序 —— 先生成再渲染，否则完成页拿不到 rec。 */
    S.rec = Store.saveAssessment(S.answers);
    Router.render("questionnaire", {});
  }

  function bindDone(v) {
    Widgets.bindGo(v);
    Widgets.bindLessonRows(v);

    var open = UI.$("[data-open-record]", v);
    if (open) open.addEventListener("click", function () {
      var id = open.getAttribute("data-open-record");
      /* 先把流程状态清掉，再回首页、再压入记录详情。
         这样在记录页按返回，落在的是首页，而不是一个已经做完了的答题页。 */
      reset();
      Router.navigate("home", {});
      Router.navigate("record", { id: id });
    });
  }

  window.Pages.questionnaire = {
    hideTab: true,
    title: function () { return S.rec ? "第一次认识自己" : "认识自己"; },
    render: render,
    bind: bind,
    /* 从别处再次进入时重置，避免上次的完成页残留 */
    enter: reset
  };
})();
</script>
<script>
/* =========================================================================
 * 成长空间 · 单条成长记录详情
 * -------------------------------------------------------------------------
 * 目前唯一可点开回看的是《第一次认识自己》。
 * 正文用 UI.textLines（转义后保留换行）——规则生成的段落里有 \n，
 * 直接塞进 <p> 会被 HTML 折叠成一行。
 * ========================================================================= */
(function () {
  "use strict";
  window.Pages = window.Pages || {};

  function findEntry(id) {
    var j = Store.journal();
    for (var i = 0; i < j.length; i++) if (j[i].id === id) return j[i];
    return null;
  }

  function render(params) {
    var e = params && params.id ? findEntry(params.id) : null;
    if (!e) {
      return '<div class="empty">' + UI.icon("pen", 30) +
        "<b>没有找到这条记录</b><p>它可能已经被清空了。</p>" +
        '<button class="btn ghost" data-go="trace" type="button">去成长轨迹</button></div>';
    }

    var rec = e.meta && e.meta.record ? e.meta.record : null;
    var h = [];

    h.push('<div class="done-head" style="padding-top:6px">' +
      '<div class="done-mark">' + UI.icon("sprout", 28) + "</div>" +
      "<h2>" + UI.esc(e.note || "成长记录") + "</h2>" +
      '<p class="muted small">' + UI.esc(UI.dotDate(e.date)) + " " + UI.esc(UI.weekday(e.date)) + "</p>" +
      "</div>");

    if (!rec) {
      h.push('<div class="card"><p>' + UI.textLines(e.note || "") + "</p></div>");
      return h.join("");
    }

    if (rec.quote) {
      h.push('<div class="rec-sec quote"><h3>那天</h3><p>' + UI.esc(rec.quote) + "</p></div>");
    }

    var secs = rec.sections || [];
    for (var i = 0; i < secs.length; i++) {
      h.push('<div class="rec-sec"><h3>' + UI.esc(secs[i].label) + "</h3>" +
        "<p>" + UI.textLines(secs[i].text) + "</p></div>");
    }

    if (rec.dimNames) {
      h.push('<div class="rec-sec"><h3>当时留意到的方向</h3>' +
        '<div class="chips">' +
        '<span class="chip ok">' + UI.esc(rec.dimNames) + "</span>" +
        "</div></div>");
    }

    h.push('<div class="rail-quiet">这是那时候的你写下的。<br>现在再看，感觉可能已经不一样了。</div>');
    h.push('<div class="btnrow" style="margin-top:16px">' +
      '<button class="btn ghost" data-go="trace" type="button">回到成长轨迹</button></div>');

    return h.join("");
  }

  function bind(v) { Widgets.bindGo(v); }

  window.Pages.record = {
    hideTab: true,
    title: "成长记录",
    render: render, bind: bind
  };
})();
</script>
<script>
/* =========================================================================
 * 成长空间 · 单个探索入口
 * -------------------------------------------------------------------------
 * 这一页的顺序是刻意的：先「被听见」，再「可以往哪走」。
 *
 * 用户点进来是因为有一个具体的感受，不是来买东西的。
 * 所以先把那句话还给他，再给方向，最后一定要留一个「今天什么都不做也行」的出口。
 *
 * 【没有】任何诊断、评估、人格类型、严重程度判断。
 * ========================================================================= */
(function () {
  "use strict";
  window.Pages = window.Pages || {};

  function render(params) {
    var t = params && params.id ? TOPICS.byId(params.id) : null;
    if (!t) {
      return '<div class="empty">' + UI.icon("compass", 30) +
        "<b>没有找到这个入口</b><p>回探索页看看别的方向。</p>" +
        '<button class="btn ghost" data-go="explore" type="button">去探索</button></div>';
    }
    /* 看过就记一笔。刻意不写进 journal —— 浏览入口不算成长活动，
       不该影响连续天数。 */
    Store.markExplored(t.id);

    var h = [];
    h.push('<div class="card" style="border-color:var(--brand-line)">' +
      '<span class="tc-ic" style="display:block;color:var(--brand);margin-bottom:10px">' +
      UI.icon(t.icon, 26) + "</span>" +
      "<h3>" + UI.esc(t.name) + "</h3>" +
      '<p class="state-text">' + UI.esc(t.echo) + "</p>" +
      '<p class="small muted" style="margin-top:12px">' +
      "这里是很多人在某个阶段都会有过的感受。它不代表你有什么问题。</p>" +
      "</div>");

    h.push('<div class="sec-head"><h2>如果想往前看一看</h2></div>');
    h.push('<p class="sec-note">这两节可能和此刻的你有关。不用一次看完。</p>');
    h.push(Widgets.lessonList(t.courses));

    h.push('<div class="coming-card" style="margin-top:6px">' +
      "<p><b>今天什么都不想做，也可以。</b></p>" +
      '<p class="muted small">把这一页关掉，去喝杯水、走一走，也是照顾自己的一种方式。</p>' +
      "</div>");

    h.push('<div class="btnrow" style="margin-top:16px">' +
      '<button class="btn ghost" data-go="explore" type="button">看看别的方向</button></div>');

    h.push('<p class="small muted" style="margin:16px 2px 0;line-height:1.8">' +
      "如果你正经历持续的困扰，找信任的人聊一聊，会比任何网页都更有帮助。</p>");

    return h.join("");
  }

  function bind(v) {
    Widgets.bindGo(v);
    Widgets.bindLessonRows(v);
    Widgets.bindFav(v, function () { Router.render("topic", Router.current().params); });
  }

  window.Pages.topic = {
    hideTab: true,
    title: function (p) {
      var t = TOPICS.byId(p.id);
      return t ? t.name : "探索";
    },
    render: render, bind: bind
  };
})();
</script>
<script>
/* =========================================================================
 * 成长空间 · 第一次问昵称
 * -------------------------------------------------------------------------
 * 只问一次，可以跳过。存的是 gs.profile.nickname，
 * 刻意【不】顺手把 done 设成 true —— 昵称和「做过 15 题」是两件事，
 * 混在一起会让「我的」页误以为用户已经认识过自己。
 *
 * 从「我的」页进来是修改模式（params.edit），文案和落点都不一样。
 * ========================================================================= */
(function () {
  "use strict";
  window.Pages = window.Pages || {};

  function render(params) {
    var edit = !!(params && params.edit);
    var cur = Store.nickname();
    var h = [];

    h.push('<div class="nick-wrap">');
    h.push('<div class="nick-mark">' + UI.icon("sprout", 28) + "</div>");

    if (edit) {
      h.push("<h2>换个称呼</h2>");
      h.push('<p class="nick-sub">想叫什么都可以，留空就是不加称呼。</p>');
    } else {
      h.push("<h2>该怎么称呼你？</h2>");
      h.push('<p class="nick-sub">只是想让这里看起来不那么陌生。<br>' +
        "随便写一个就好，也可以跳过。</p>");
    }

    h.push('<input type="text" data-field="nick" maxlength="12" ' +
      'placeholder="写一个称呼" value="' + UI.esc(cur) + '" ' +
      'autocomplete="off" aria-label="昵称">');

    h.push('<div class="btnrow" style="margin-top:18px">' +
      '<button class="btn primary" data-save-nick="1" type="button">' +
      (edit ? "保存" : "就这样开始") + "</button></div>");

    /* 示例入口和「先跳过」并列，而且放在后面：
       先跳过是「不想写名字」，先看看示例是「还不知道这是干嘛的」——
       后者才是第一次打开的人真正的问题，所以给它一个出口。 */
    if (!edit) {
      h.push('<p class="center nick-alt" style="margin-top:14px">' +
        '<button class="link small" data-skip="1" type="button">先跳过</button>' +
        '<span class="nick-sep" aria-hidden="true">·</span>' +
        '<button class="link small" data-demo="1" type="button">先看看示例</button>' +
        "</p>");
    }

    h.push('<p class="small muted center" style="margin-top:22px;line-height:1.8">' +
      "只存在这台设备上。<br>没有账号，也不会被上传。</p>");
    h.push("</div>");

    return h.join("");
  }

  function bind(v, params) {
    var edit = !!(params && params.edit);
    var input = UI.$('[data-field="nick"]', v);
    var save = UI.$("[data-save-nick]", v);

    function commit(next) {
      var name = input ? input.value : "";
      Store.saveNickname(name);
      UI.toast(name.replace(/^\s+|\s+$/g, "") ? "好，就这样叫你" : "好，那就不加称呼");
      /* 修改模式回「我的」，首次进来去首页 */
      Router.navigate(edit ? "me" : "home", {});
    }

    if (save) save.addEventListener("click", function () { commit(); });
    if (input) input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); commit(); }
    });

    var skip = UI.$("[data-skip]", v);
    if (skip) skip.addEventListener("click", function () {
      Store.saveNickname("");
      Router.navigate("home", {});
    });

    if (input) {
      /* 移动端键盘弹起会顶掉半屏，聚焦后滚一下，别让输入框被挡住 */
      try { input.focus({ preventScroll: true }); } catch (err) { input.focus(); }
    }
  }

  window.Pages.nickname = {
    hideTab: true,
    hideBar: true,
    title: "称呼",
    render: render, bind: bind
  };
})();
</script>
<script>
/* =========================================================================
 * 课程学习页：阅读 → 今日练习 → 自我反思 → 完成/保存 → 完成反馈
 * 数据在“完成”那一刻一次性写入（课程进度 + 练习 + 成长记录）。
 * ========================================================================= */
(function () {
  "use strict";
  window.Pages = window.Pages || {};

  var cur = null;          // 当前课程
  var state = null;        // { stage:0..3, note:'', refs:[] }

  function reset(c) {
    cur = c;
    state = { stage: 0, note: "", refs: [], saved: false };
  }

  function bodyHtml(c) {
    var h = [];
    for (var i = 0; i < c.body.length; i++) {
      var b = c.body[i];
      if (b.t === "h") h.push('<h4 class="body-h">' + UI.esc(b.x) + '</h4>');
      else if (b.t === "case") h.push('<div class="case"><span class="case-tag">一个生活里的场景</span><p>' + UI.esc(b.x) + '</p></div>');
      else h.push('<p class="body-p">' + UI.esc(b.x) + '</p>');
    }
    return h.join("");
  }

  /* 顶部进度指示：三个步骤 */
  function stepDots(stage) {
    var labels = ["阅读", "练习", "反思"];
    var h = ['<div class="stepper">'];
    for (var i = 0; i < 3; i++) {
      var cls = i < stage ? "on" : (i === stage ? "cur" : "");
      h.push('<span class="step ' + cls + '"><i>' + (i + 1) + '</i>' + labels[i] + '</span>');
    }
    h.push('</div>');
    return h.join("");
  }

  function draw() {
    var c = cur, s = state;
    var done = Store.isDone(c.id);
    var v = UI.$("#view");
    var h = [];

    /* 头信息 */
    h.push('<div class="lesson-head">');
    /* 区域名从数据里取，不再写死「中央区 · 自我认知与反应」——
       一旦往别的门类加课，写死的那行会把所有课都标成中央区。 */
    var region = (window.GData && GData.regionById) ? GData.regionById(c.regionId) : null;
    var regionName = region ? region.name : "成长方向";
    h.push('<div class="lh-meta"><span class="tag ok">' + UI.esc(regionName) + ' · 第 ' + UI.courseNo(c.order) +
      ' 节</span><span class="muted">预计 ' + c.minutes + ' 分钟</span></div>');
    h.push('<h2>' + UI.esc(c.title) + '</h2>');
    h.push('<p class="sub">' + UI.esc(c.summary) + '</p>');
    if (done && s.stage < 3) h.push('<div class="ribbon">已完成 ✓ · 可以复习，或再做一次练习/反思</div>');
    h.push(stepDots(Math.min(s.stage, 2)));
    h.push('</div>');

    if (s.stage === 0) {
      h.push('<article class="reading">' + bodyHtml(c) + '</article>');
      h.push('<div class="action-bar"><button class="btn primary wide" id="toPractice">我已经读完 → 进入今日练习</button></div>');
    } else if (s.stage === 1) {
      h.push('<section class="card">');
      h.push('<div class="card-head"><span class="label">今日练习</span></div>');
      h.push('<h3>' + UI.esc(c.practice.title) + '</h3>');
      h.push('<ol class="steps">');
      for (var i = 0; i < c.practice.steps.length; i++) h.push('<li>' + UI.esc(c.practice.steps[i]) + '</li>');
      h.push('</ol>');
      h.push('<label class="field"><span>' + UI.esc(c.practice.prompt) + '</span>' +
        '<textarea id="note" rows="4" placeholder="写点什么，或先留白……"></textarea></label>');
      h.push('<button class="btn primary wide" id="savePractice">保存我的练习</button>');
      h.push('</section>');
      h.push('<div class="btnrow center"><button class="link" id="backRead">← 回到课程内容</button></div>');
    } else if (s.stage === 2) {
      h.push('<section class="card">');
      h.push('<div class="card-head"><span class="label">自我反思</span><span class="muted">想写就写，写不下也没关系</span></div>');
      for (var r = 0; r < c.reflections.length; r++) {
        var q = c.reflections[r];
        h.push('<label class="field"><span class="q">' + UI.esc(q.q) + '</span>' +
          (q.hint ? '<span class="hint">' + UI.esc(q.hint) + '</span>' : "") +
          '<textarea data-ref="' + r + '" rows="2" placeholder="写下你的想法……"></textarea></label>');
      }
      var btn = done ? "保存这次的记录" : "完成这节课";
      h.push('<button class="btn primary wide bigpad" id="finishLesson">' + btn + '</button>');
      h.push('</section>');
      h.push('<div class="btnrow center"><button class="link" id="backPractice">← 回到练习</button></div>');
    } else {
      /* stage 3：完成反馈 */
      h.push('<section class="card finish">');
      h.push('<div class="big">完成</div>');
      h.push('<h3>' + (done ? '这节课复习完成' : '这节课完成') + '</h3>');
      h.push('<p class="sub">' + UI.esc(c.feedback.text) + '</p>');
      h.push('<div class="tip"><span>接下来</span>' + UI.esc(c.feedback.tip) + '</div>');
      var next = Course.nextAfter(c.id);
      h.push('<div class="btnrow">');
      h.push('<button class="btn primary" id="goHome">回首页</button>');
      if (next) h.push('<button class="btn ghost" id="goNext">下一节</button>');
      h.push('<button class="btn ghost" id="goTrace">成长轨迹</button>');
      h.push('</div></section>');
    }

    v.innerHTML = h.join("");
    bind();
    window.scrollTo(0, 0);
  }

  function bind() {
    var s = state;
    var el1 = UI.$("#toPractice", UI.$("#view"));
    if (el1) el1.addEventListener("click", function () { s.stage = 1; draw(); });

    var elB = UI.$("#backRead", UI.$("#view"));
    if (elB) elB.addEventListener("click", function () { s.stage = 0; draw(); });

    var save = UI.$("#savePractice", UI.$("#view"));
    if (save) {
      save.addEventListener("click", function () {
        s.note = UI.$("#note", UI.$("#view")).value.trim();
        s.saved = true;
        UI.toast("练习已保存");
        s.stage = 2;
        draw();
      });
    }

    var elP = UI.$("#backPractice", UI.$("#view"));
    if (elP) elP.addEventListener("click", function () { s.stage = 1; draw(); });

    /* 反思输入即时同步 */
    var refs = UI.$all("[data-ref]", UI.$("#view"));
    for (var i = 0; i < refs.length; i++) (function (ta) {
      var idx = Number(ta.getAttribute("data-ref"));
      if (s.refs[idx]) ta.value = s.refs[idx];
      ta.addEventListener("input", function () { s.refs[idx] = ta.value.trim(); });
    })(refs[i]);

    var fin = UI.$("#finishLesson", UI.$("#view"));
    if (fin) {
      fin.addEventListener("click", function () {
        fin.disabled = true;
        var done = Store.isDone(cur.id);
        if (done) Store.logSession(cur.id, { practiceNote: s.note });
        else Store.completeCourse(cur.id, { practiceNote: s.note, reflections: s.refs.slice() });
        s.stage = 3;
        draw();
      });
    }

    var home = UI.$("#goHome", UI.$("#view"));
    if (home) home.addEventListener("click", function () { Router.navigate("home"); });
    var nxt = UI.$("#goNext", UI.$("#view"));
    if (nxt) nxt.addEventListener("click", function () {
      var nx = Course.nextAfter(cur.id);
      if (nx) Router.render("lesson", { id: nx.id });
    });
    var tr = UI.$("#goTrace", UI.$("#view"));
    if (tr) tr.addEventListener("click", function () { Router.navigate("trace"); });
  }

  Pages.lesson = {
    hideTab: true,
    title: function (p) {
      var c = Course.byId(p.id);
      return c ? "第 " + UI.courseNo(c.order) + " 节" : "课程";
    },
    render: function (p) {
      var c = Course.byId(p.id) || COURSES[0];
      reset(c);
      return '<div class="page-loading">…</div>';
    },
    bind: function () { draw(); }
  };
})();
</script>
<script>
/* =========================================================================
 * 成长空间 · 9 区地图 + 单个方向详情
 * -------------------------------------------------------------------------
 * 9 区从「一个 tab」降级成「探索页里的一个区块」——它仍然必须被渲染出来。
 * js/data/regions.js 的 9 个对象、顺序、pos、id 一行不动，这里只负责画。
 *
 * ZoneMap 是给别处复用的：探索页把地图直接嵌进去。
 * ========================================================================= */
(function () {
  "use strict";
  window.Pages = window.Pages || {};

  function zoneStatusText(r) {
    return r.status === "live" ? "可学习" : "即将开放";
  }

  function doneOf(regionId) {
    var cs = window.Course ? Course.ofRegion(regionId) : [];
    var done = 0;
    for (var i = 0; i < cs.length; i++) if (Store.isDone(cs[i].id)) done++;
    return { done: done, total: cs.length };
  }


  var ZoneMap = {
    html: function () {
      var cells = [], R = GData.regions;
      for (var i = 0; i < R.length; i++) {
        var r = R[i], live = r.status === "live";
        var count = "";
        if (live) {
          var d = doneOf(r.id);
          count = '<span class="zc-count">' + d.done + " / " + d.total + "</span>";
        }
        cells.push('<a class="zone-cell' + (live ? " live" : "") +
          '" style="grid-row:' + r.pos.r + ";grid-column:" + r.pos.c +
          '" data-zone="' + r.id + '">' +
          '<span class="zc-name">' + UI.esc(r.name) + "</span>" + count +
          '<span class="zc-status' + (live ? " ok" : "") + '">' + zoneStatusText(r) + "</span></a>");
      }
      return '<div class="zonemap">' + cells.join("") + "</div>";
    },
    bind: function (root) {
      var els = UI.$all(".zone-cell", root);
      for (var i = 0; i < els.length; i++) (function (b) {
        b.addEventListener("click", function () {
          Router.navigate("zone", { id: b.getAttribute("data-zone") });
        });
      })(els[i]);
    }
  };

  window.ZoneMap = ZoneMap;

  /* ---- 单个方向的详情 ---- */
  window.Pages.zone = {
    hideTab: true,
    title: function (p) {
      var r = GData.regionById(p.id);
      return r ? r.name : "成长方向";
    },
    render: function (p) {
      var r = GData.regionById(p.id);
      if (!r) return '<div class="empty">' + UI.icon("compass", 30) +
        "<b>没有找到这个方向</b><p>它可能已经调整过了，回探索页看看别的。</p></div>";
      var h = [];

      h.push('<section class="card">' +
        '<div class="zone-head"><h2>' + UI.esc(r.name) + "</h2>" +
        '<span class="tag ' + r.status + '">' + zoneStatusText(r) + "</span></div>" +
        '<p class="sub">' + UI.esc(r.intro) + "</p></section>");

      h.push('<section class="mods"><div class="label">这个方向包含</div>');
      for (var i = 0; i < r.subTopics.length; i++) {
        h.push('<div class="mod' + (r.status === "live" ? "" : " soon") + '"><span class="dot"></span>' +
          UI.esc(r.subTopics[i]) +
          (r.status === "soon" ? '<span class="soon-tag">即将开放</span>' : "") +
          "</div>");
      }
      h.push("</section>");

      if (r.status === "live") {
        var cs = Course.ofRegion(r.id);
        h.push('<section class="lessons"><div class="label">本区课程</div>');
        for (var k = 0; k < cs.length; k++) h.push(Widgets.lessonRow(cs[k]));
        h.push("</section>");
      } else {
        h.push('<section class="coming-card"><p>这个方向还在准备中。</p>' +
          '<p class="muted small">不用等它。中央区那几节，现在就可以开始。</p></section>');
      }
      return h.join("");
    },
    bind: function (v) {
      Widgets.bindLessonRows(v);
      Widgets.bindFav(v);
    }
  };
})();
</script>
<!-- 启动 -->
<script>
/* =========================================================================
 * 成长空间 · 启动
 * -------------------------------------------------------------------------
 * 两件事，顺序不能颠倒：
 *   1. migrate() —— 给老用户的 profile 补 answersVersion 标记（只加字段，
 *      绝不动 answers / portrait）。必须在任何页面读 profile 之前跑。
 *   2. Router.init() —— 生成两套导航（手机底栏 + 桌面侧栏，同一份 TABS）。
 *
 * 首屏落点：
 *   - 从没被问过称呼（nicknameSetAt 不存在）→ 先问一次，可以跳过
 *   - 其余情况 → URL 上的 #页码（认得出的话），否则首页
 * 刻意【不】把没做过 15 题的人直接扔进答题页 ——
 * 首页第一屏本来就是这个入口，强行进入会变成「被考试」。
 * ========================================================================= */
(function () {
  "use strict";

  /* 纯静态单页，不需要 history —— hash 只决定首屏落在哪一页，
     之后的路由仍由 Router 自己管（它不会回写 hash）。
     有了这一步，#成长轨迹 这类链接才能被收藏、被直接打开。 */
  function firstPage() {
    var name = String(location.hash || "").replace(/^#\/?/, "");
    return (name && window.Pages[name]) ? name : "home";
  }

  /* ---- 示例模式 ---------------------------------------------------------
     所有页面都是在 render 的时候读数据的，所以进出示例只需要
     「换掉数据源 → 重新导航一次」，没有别的收尾工作。 */
  function syncDemo() {
    var on = Store.isDemo();
    var bar = UI.$("#demoBar");
    if (bar) bar.hidden = !on;
    /* body 上的类会顶开固定的横幅（见 style.css 里 --demoh 那几条） */
    document.body.classList.toggle("demo-on", on);
  }

  function enterDemo() {
    Store.startDemo();
    syncDemo();
    Router.navigate("home", {});
    UI.toast("随便点，不会留下任何记录");
  }

  function exitDemo() {
    Store.stopDemo();
    syncDemo();
    /* 没设过称呼的人退回称呼页，否则首页会「你好，」后面空着一块 */
    var p = Store.getProfile();
    Router.navigate(p && p.nicknameSetAt !== undefined ? "home" : "nickname", {});
  }

  function boot() {
    Store.migrate();
    Router.init();

    var exit = UI.$("#demoExit");
    if (exit) exit.addEventListener("click", exitDemo);
    /* 进入示例的入口有两个（称呼页 / 首页空状态），
       都走事件委托 —— 它们是重渲染出来的，直接绑会随重渲染一起没掉 */
    document.addEventListener("click", function (e) {
      var t = e.target;
      while (t && t !== document) {
        if (t.hasAttribute && t.hasAttribute("data-demo")) {
          e.preventDefault();
          enterDemo();
          return;
        }
        t = t.parentNode;
      }
    });

    var p = Store.getProfile();
    if (!p || p.nicknameSetAt === undefined) Router.navigate("nickname", {});
    else Router.navigate(firstPage(), {});
  }

  /* 清空本地数据 + 回到首屏，方便反复验收 */
  window.devReset = function () {
    Store.resetAll();
    UI.toast("本地数据已清空");
    Router.navigate("nickname", {});
  };

  /* 控制台里手动进出示例，验收用 */
  window.devDemo = function (on) {
    if (on === false) exitDemo(); else enterDemo();
    return Store.isDemo() ? "示例模式：开" : "示例模式：关";
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
