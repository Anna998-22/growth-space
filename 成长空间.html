/* =========================================================================
   成长空间 · 样式
   温和、简洁、有一点治愈感；成人向生活方式工具；移动端优先。

   两条纪律，改动前请先读：
   1. :root 里的变量【名】只增不改 —— 全文件的颜色只从变量取，没有第二处 hex。
      改色板只动 :root 一段，页面样式自动跟随。
   2. 基础态写死手机形态；900px 加左栏，1180px 加右栏。桌面端坚持 body 滚动，
      不做内部滚动容器 —— router.js / lesson.js 靠 window.scrollTo(0,0) 复位，
      主区一旦变成 overflow:auto，切页会静默保留上一页滚动位置。
   ========================================================================= */

:root{
  /* —— 表层 —— */
  --bg:#f7f5f1;
  --bg-2:#f1eee8;
  --card:#ffffff;
  --glow:#eae5da;            /* ≥600px 时 body 上那层极淡的氛围光 */

  /* —— 文字 —— */
  --ink:#2f2c28;
  --ink-2:#56514a;
  --muted:#7d766c;           /* 已调到对白底 ≈4.5:1 */
  --faint:#a49c8f;           /* 纯装饰用，不承载信息 */
  --faint-2:#c6bfb2;

  /* —— 线 —— */
  --line:#e9e4db;
  --line-2:#f0ece5;
  --track:#eae4d9;           /* 进度条底槽 */

  /* —— 主色：雾绿 —— */
  --brand:#7d9c92;           /* 只做填充（点、线、条），不做文字底色 */
  --brand-2:#a8c0b5;         /* 渐变的另一端 */
  --brand-ink:#45655c;       /* 文字 / 主按钮底：对白 6.4:1 */
  --brand-soft:#eaf1ee;
  --brand-soft-2:#f2f8f5;
  --brand-line:#cfded7;
  --on-brand:#ffffff;

  /* —— 辅色：雾蓝 —— */
  --mist:#8fa6b8;
  --mist-ink:#4e6b7c;
  --mist-soft:#ecf1f5;

  /* —— 点缀：米杏 / 暖橙（少量） —— */
  --warm:#c99a6e;
  --warm-ink:#8f5a2e;
  --warm-soft:#f9efe4;
  --warm-line:#f0ddc9;

  /* —— 中性标签 / 已完成态 —— */
  --tint:#f0ece4;
  --tint-ink:#7b7467;
  --tint-2:#f3f1ec;
  --tint-2-ink:#9c958a;
  --done-bg:#fafaf7;
  --done-line:#e3dfd3;
  --done-tint:#eef0e6;
  --done-ink:#a6a194;
  --step-bg:#efe9dc;
  --step-ink:#9f988b;
  --field:#fbfaf6;

  /* —— 正文（比 --ink 略软，长文阅读用） —— */
  --reading:#33312c;
  --reading-2:#3b3832;

  /* —— 尺寸 —— */
  --radius:18px;
  --radius-sm:13px;
  --shadow:0 8px 24px rgba(70,62,50,.055);
  --shadow-lift:0 12px 30px rgba(70,62,50,.09);
  --maxw:640px;
  --rail-w:236px;
  --rail2-w:300px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  line-height:1.7;
  min-height:100vh;
  /* iOS 的 100vh 量的是「地址栏收起时」的高度，比看得见的区域高 ——
     用它当最小高度，页面底部会多出一截空白。dvh 才是跟着视口变的那一个。
     先写 vh 再写 dvh：不认识 dvh 的浏览器保留上面那行，不会两边都落空。 */
  min-height:100dvh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:var(--ink)}

/* 手指点按的两个细节：
   touch-action:manipulation 去掉移动端「等 300ms 看是不是双击」的延迟，
   点了就有反应；再配一条 :active 反馈，否则手机上完全不知道自己点中没有。
   （-webkit-tap-highlight-color 已经在上面全局关掉了，那是系统默认的高亮块，
     又丑又不受控，所以这里用 transform 自己给一个更轻的。） */
button,.topic-card,.lesson-row,.q-opt,.tab{
  touch-action:manipulation;
}
@media (hover:none){
  button:active,.topic-card:active,.lesson-row:active,.q-opt:active,.tab:active{
    opacity:.72;
  }
}

.hidden{display:none !important}

/* 键盘可达性：鼠标点击不留框，键盘 Tab 才显示 */
:focus{outline:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* =========================================================================
   外壳：手机是单列流式；≥900px 起左栏；≥1180px 起右栏。
   #rail / #rail2 在基础态直接 display:none，不占位。
   ========================================================================= */
#app{display:block}
#rail,#rail2{display:none}

#rail .rail-logo{
  display:flex;align-items:center;gap:10px;
  padding:0 12px 22px;color:var(--brand-ink);
}
#rail .rl-mark{display:flex;color:var(--brand);flex:none}
#rail .rl-text{font-size:16px;font-weight:700;letter-spacing:.06em;line-height:1.25}
#rail .rl-text em{
  display:block;font-style:normal;font-size:10px;font-weight:400;
  letter-spacing:.14em;color:var(--faint);margin-top:3px;
}
#rail .rail-quote{
  margin:auto 12px 0;padding-top:22px;
  font-size:12px;line-height:1.9;color:var(--faint);
  border-top:1px solid var(--line);
}

/* 页面容器 */
main#view{
  max-width:var(--maxw);
  margin:0 auto;
  padding:18px 20px 104px;
}
body.no-tab main#view{padding-bottom:36px}

/* ---------- 顶栏 ---------- */
#topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:center;
  height:52px;
  background:var(--bg);                                   /* color-mix 不支持时的回退 */
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
#topbar.hidden{display:none}
#pageTitle{font-size:15px;font-weight:600;letter-spacing:.04em}
#btnBack{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:40px;height:40px;font-size:26px;line-height:1;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;
}
#btnBack .bb-label{display:none;font-size:13px;font-weight:500;letter-spacing:.02em}
body.no-bar #topbar{display:none}

/* ---------- 主导航（两个容器共用 .tab 规则，数据源只有 router.js 的 TABS 一处） ---------- */
.tab{
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);letter-spacing:.03em;
  transition:color .15s ease, background .15s ease;
}
.tab .ic{flex:none}

#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  max-width:var(--maxw);margin:0 auto;
  display:flex;
  background:var(--card);                                 /* color-mix 回退 */
  background:color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar.hidden{display:none}
#tabbar .tab{
  flex:1;height:60px;flex-direction:column;gap:3px;
  font-size:11.5px;position:relative;
}
#tabbar .tab.on{color:var(--brand-ink);font-weight:600}
#tabbar .tab.on::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:2px;border-radius:0 0 3px 3px;background:var(--brand);
}

/* ---------- 示例模式横幅 ----------
   固定在顶部，所以它会盖住所有 top:0 的 sticky 元素。
   --demoh 是「横幅有多高」，body 用它顶开内容，下面几条用它把
   顶栏 / 左栏 / 右栏的 sticky 起点一起推下来 —— 少推一个，
   那个元素就会永远藏在横幅底下。 */
body.demo-on{
  --demoh:calc(46px + env(safe-area-inset-top));
  padding-top:var(--demoh);
}
body.demo-on #topbar{top:var(--demoh)}

#demoBar{
  position:fixed;left:0;right:0;top:0;z-index:70;
  min-height:46px;
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:0 14px;
  padding-top:env(safe-area-inset-top);   /* 刘海机：别让文字躲进状态栏 */
  background:var(--ink);
  color:var(--on-brand);
  font-size:12.5px;
  line-height:1.4;
}
/* 必须显式写这一条。上面给了 display:flex，作者样式盖过浏览器默认的
   [hidden]{display:none} —— 于是 hidden 属性虽然还在，横幅却照样占着
   46px 显示在每一页上。顶栏和底栏也一样，各有各的 .hidden 规则。 */
#demoBar[hidden]{display:none}
#demoExit{
  flex:none;
  padding:6px 12px;border-radius:99px;
  font-size:12px;font-weight:600;
  background:var(--on-brand);color:var(--ink);
  touch-action:manipulation;
}
.db-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 轻提示 ---------- */
#toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(8px);
  z-index:60;background:rgba(47,44,40,.9);color:var(--on-brand);
  font-size:13px;padding:9px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s ease;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.no-tab #toast{bottom:40px}

/* ---------- 通用 ---------- */
.muted{color:var(--muted)}
.small{font-size:12px}
.center{text-align:center}
.ic{display:block;flex:none}
.label{
  font-size:11.5px;letter-spacing:.16em;color:var(--muted);
  text-transform:uppercase;
}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px 18px;
  margin:0 0 14px;
}
.card-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:6px;gap:10px;
}
.card h3{margin:2px 0 6px;font-size:17px;line-height:1.5;letter-spacing:.01em}
.card .sub,.card p{margin:4px 0}
.meta{font-size:13px;margin:2px 0}
.tag{
  display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;
  background:var(--tint);color:var(--tint-ink);white-space:nowrap;
}
.tag.live,.tag.ok{background:var(--brand-soft);color:var(--brand-ink)}
.tag.soon{background:var(--tint-2);color:var(--tint-2-ink)}
.page-intro{color:var(--ink-2);font-size:14px;margin:6px 2px 14px}

/* 区块标题（首页/记录/探索各块共用） */
.sec-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:10px;margin:22px 2px 10px;
}
.sec-head h2{margin:0;font-size:16px;font-weight:600;letter-spacing:.01em}
.sec-head .link{padding:0}
.sec-note{font-size:12.5px;color:var(--muted);margin:-4px 2px 10px}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:46px;padding:0 20px;border-radius:999px;
  font-size:15px;font-weight:600;letter-spacing:.02em;
  transition:transform .08s ease, opacity .15s;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand-ink);color:var(--on-brand)}
.btn.ghost{background:var(--card);color:var(--brand-ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1;min-width:120px}
.btnrow.center{justify-content:center}
.bigpad{margin-top:6px}
.link{
  color:var(--brand-ink);font-size:14px;padding:6px 2px;font-weight:500;
}
.link.small{font-size:12px;color:var(--muted)}

/* 进度条与统计 */
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:999px;transition:width .4s ease}
.bar.mini{margin:10px 0 2px}
.statrow{display:flex;gap:6px;margin-top:12px}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:20px;font-weight:700;letter-spacing:.01em}
.stat span{font-size:11px;color:var(--muted)}

/* ---------- 首页 ---------- */
.hero{
  background:linear-gradient(160deg,var(--brand-soft),var(--bg-2));
  border-radius:22px;padding:20px 20px 22px;margin-bottom:16px;
}
.hero-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand-mini{font-size:12px;letter-spacing:.28em;color:var(--brand-ink);font-weight:600}
.streak-chip{
  font-size:12px;color:var(--brand-ink);
  background:rgba(255,255,255,.65);
  padding:4px 11px;border-radius:999px;
}
.greet{font-size:13px;color:var(--brand-ink);margin:0 0 2px}
.hero-q{font-size:26px;line-height:1.35;margin:0;font-weight:700;letter-spacing:.01em}
.today-card h3{font-size:19px}
.today-card .btn{margin-top:14px}
.today-note{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 6px}
.done-card .big{font-size:15px;color:var(--brand-ink);background:var(--brand-soft);display:inline-block;padding:8px 14px;border-radius:999px;margin-bottom:8px;font-weight:700;letter-spacing:.1em}
.card .pt{font-weight:600;color:var(--ink-2)}

/* 首页问候头（参考图里：左问候，右日期） */
.home-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:14px;margin:4px 2px 18px;
}
.home-head h1{margin:0;font-size:21px;line-height:1.4;letter-spacing:.01em}
.home-head .sub{font-size:13px;color:var(--muted);margin:5px 0 0}
.home-date{
  flex:none;text-align:right;font-size:11.5px;color:var(--muted);
  line-height:1.6;letter-spacing:.03em;padding-top:3px;
}
.home-date b{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2)}

/* 探索入口（首页「最近的你，还好吗？」） */
.invite{
  position:relative;overflow:hidden;
  background:linear-gradient(150deg,var(--brand-soft) 0%,var(--mist-soft) 58%,var(--warm-soft) 130%);
  border:1px solid var(--brand-line);
  border-radius:22px;padding:22px 20px 20px;margin:0 0 16px;
}
.invite .inv-kicker{
  font-size:11px;letter-spacing:.2em;color:var(--brand-ink);
  font-weight:600;margin:0 0 8px;
}
.invite h2{margin:0;font-size:22px;line-height:1.4;letter-spacing:.01em}
.invite .inv-sub{font-size:13.5px;color:var(--ink-2);margin:9px 0 0;line-height:1.75}
.invite .inv-note{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.7}
.invite .inv-meta{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:11.5px;color:var(--muted);margin:0 0 14px;letter-spacing:.03em;
}
.invite .btn{margin-top:16px}
.invite.done{background:linear-gradient(150deg,var(--brand-soft),var(--card))}
/* 角上那抹水彩：纯 CSS 径向渐变，不引外部图片 */
.invite .inv-art{
  position:absolute;right:-46px;top:-46px;width:190px;height:190px;
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 38% 38%,
    rgba(143,166,184,.30), rgba(143,166,184,.10) 58%, transparent 72%);
}
.invite .inv-art::after{
  content:"";position:absolute;left:26px;top:52px;width:110px;height:110px;
  border-radius:50%;
  background:radial-gradient(circle at 45% 45%,
    rgba(201,154,110,.24), rgba(201,154,110,.07) 60%, transparent 74%);
}
.invite-inner{position:relative}

/* ---------- 探索主题入口 ---------- */
.topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.topic-card{
  display:block;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:14px 14px 13px;
  transition:transform .1s ease, box-shadow .18s ease, border-color .18s ease;
}
.topic-card:active{transform:scale(.985)}
.topic-card .tc-ic{color:var(--brand);margin-bottom:9px}
.topic-card b{display:block;font-size:14.5px;line-height:1.45;font-weight:600}
.topic-card .tc-sub{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.6}
.topic-card.seen{border-color:var(--brand-line);background:var(--brand-soft-2)}
.topic-card.seen .tc-ic{color:var(--brand-ink)}

/* ---------- 9 区地图 ---------- */
.zonemap{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(84px,auto);
  gap:9px;
}
.zone-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  text-align:center;padding:8px 6px;color:var(--ink-2);
  text-decoration:none;min-height:84px;
}
.zone-cell.live{
  background:linear-gradient(160deg,var(--brand-soft-2),var(--card));
  border-color:var(--brand-line);
}
.zc-name{font-size:12.5px;font-weight:600;line-height:1.35}
.zc-count{font-size:11px;color:var(--brand-ink);margin-top:2px;font-weight:600}
.zc-status{font-size:10px;color:var(--faint);margin-top:2px;letter-spacing:.05em}
.zc-status.ok{color:var(--brand-ink)}

/* 区域详情 */
.zone-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.zone-head h2{margin:0;font-size:22px}
.mods{margin:0 0 14px}
.mods .label,.lessons .label{margin:4px 2px 8px}
.mod{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--line);
  padding:12px 14px;border-radius:14px;margin-bottom:8px;font-size:14px;
}
.mod .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}
.mod.soon{color:var(--muted)}
.mod.soon .dot{background:var(--faint-2)}
.soon-tag{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.lessons .label{margin-top:6px}
.coming-card{background:var(--warm-soft);border-radius:var(--radius);padding:16px 18px;border:1px solid var(--warm-line)}

/* 课程行 */
.lesson-row{
  display:flex;align-items:center;gap:11px;
  background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:12px 13px;margin-bottom:9px;
  transition:border-color .18s ease, box-shadow .18s ease;
}
.lesson-row.done{background:var(--done-bg);border-color:var(--done-line)}
.lesson-row.done .lr-text b{color:var(--muted)}
.lesson-row .lr-main{display:flex;align-items:center;gap:12px;min-width:0}
.lr-no{
  flex:none;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);
}

/* 旧时间线（archive.js 退役后由 .tl 取代，保留以免旧引用裸奔） */
.timeline{list-style:none;margin:6px 0 0;padding:0}
.timeline li{

}
.timeline li:last-child{border-bottom:none}
.tl-date{flex:none;width:52px;font-size:11px;color:var(--muted);line-height:1.4;text-align:right}
.tl-date em{display:block;font-style:normal;color:var(--faint-2)}
.tl-main{min-width:0;font-size:13.5px}
.tl-main b{font-weight:600;font-size:13.5px;color:var(--ink-2)}
.tl-main .note{margin:2px 0 0;font-size:13px;color:var(--ink-2);white-space:pre-wrap}
.review p{color:var(--ink-2)}

/* =========================================================================
   成长轨迹时间轴（Widgets.timeline）
   同一份数据、两种排布：.tl-v 纵向（页面/手机），.tl-h 横向（首页宽屏）。
   横向必须自带 .tl-scroll 滚动容器，否则会把桌面栅格撑爆。
   ========================================================================= */
.tl{list-style:none;margin:0;padding:0}
.tl-item{position:relative}
.tl-dot{
  position:absolute;width:11px;height:11px;border-radius:50%;
  background:var(--card);border:2px solid var(--brand-line);
}
.tl-item.k-assessment .tl-dot{background:var(--brand);border-color:var(--brand)}
.tl-item.k-course .tl-dot{border-color:var(--brand)}
.tl-item.k-mood .tl-dot{background:var(--warm);border-color:var(--warm)}
.tl-item.k-note .tl-dot{background:var(--mist);border-color:var(--mist)}
.tl-date{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em}
.tl-title{display:block;font-size:14.5px;font-weight:600;line-height:1.5;margin-top:1px}
.tl-quote{font-size:13px;color:var(--ink-2);margin:4px 0 0;line-height:1.7}

/* 纵向 */
.tl-v .tl-item{display:block;padding:0 0 20px 26px;min-height:46px}
.tl-v .tl-dot{left:0;top:5px}
.tl-v .tl-item::before{
  content:"";position:absolute;left:5px;top:19px;bottom:-2px;
  width:1px;background:var(--line);
}
.tl-v .tl-item:last-child{padding-bottom:2px}
.tl-v .tl-item:last-child::before{display:none}

/* 「横向」（.tl-h）：手机上就是纵向，≥900px 才真的横过来。
   要求「手机端成长轨迹改为纵向」，所以 DOM 只渲染一份，靠断点切换排布，
   而不是在 JS 里读 matchMedia 猜屏幕宽度（那样拖窗口就不会重排）。 */
.tl-scroll{overflow:visible;margin:0;padding:0}
.tl-h .tl-item{display:block;padding:0 0 20px 26px;min-height:46px}
.tl-h .tl-dot{left:0;top:5px}
.tl-h .tl-item::before{
  content:"";position:absolute;left:5px;top:19px;bottom:-2px;width:1px;background:var(--line);
}
.tl-h .tl-item:last-child{padding-bottom:2px}
.tl-h .tl-item:last-child::before{display:none}

/* —— 横向时间轴只在宽屏成立 —— */
@media (min-width:900px){
  .tl-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .tl-scroll::-webkit-scrollbar{height:5px}
  .tl-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
  /* 右边缘渐隐：卡在边界上被切一半的卡片，看起来像「坏了」，
     渐隐之后它才读作「右边还有，可以滑」。
     遮罩只取 alpha，--ink 是纯色，用它就不用引入新的色值。 */
  .tl-scroll{
    -webkit-mask-image:linear-gradient(90deg,var(--ink) calc(100% - 46px),transparent);
    mask-image:linear-gradient(90deg,var(--ink) calc(100% - 46px),transparent);
  }
  .tl-h{display:flex;align-items:flex-start;padding:2px 0 8px}
  .tl-h .tl-item{flex:0 0 auto;width:172px;padding:0 18px 0 0;min-height:96px}
  .tl-h .tl-dot{top:3px}
  .tl-h .tl-item::before{
    left:0;right:0;top:8px;bottom:auto;width:auto;height:1px;background:var(--line);
  }
  .tl-h .tl-item:last-child{border-bottom:none;padding-bottom:0}
  .tl-h .tl-item:last-child::before{display:block;background:linear-gradient(90deg,var(--line),transparent)}
  .tl-h .tl-date{padding-top:20px}
  .tl-h .tl-title{font-size:13.5px}
  .tl-h .tl-quote{font-size:12px;color:var(--muted);margin-top:3px}
  /* 引言长短不一时卡片底边会参差，限两行让一排看起来是齐的 */
  .tl-h .tl-title,.tl-h .tl-quote{
    display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;
    -webkit-line-clamp:2;
  }
  .tl-h .tl-title{-webkit-line-clamp:1}
}

/* =========================================================================
   心情曲线（手写 SVG，无图表库）
   ========================================================================= */
.mood-wrap{position:relative}
.mood-curve{

}

}

/* 今日小记 */

.note-box textarea{min-height:88px}

}

.note-foot .btn{min-height:38px;padding:0 18px;font-size:13.5px}

/* 记录条目（记录页 / 我的） */
.rec-item{
  display:flex;align-items:flex-start;gap:11px;
  padding:13px 14px;background:var(--card);border:1px solid var(--line);

}

.rec-item .ri-body{min-width:0;flex:1}
.rec-item .ri-body b{display:block;font-size:14px;font-weight:600;line-height:1.5}
.rec-item .ri-body p{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.65}
.rec-item .ri-body .when{font-size:11px;color:var(--faint);letter-spacing:.03em}
.rec-item.k-mood .ri-ic{color:var(--warm)}
.rec-item.k-note .ri-ic{color:var(--mist-ink)}

/* 空状态：有内容、有指引，不是一片空白 */
.empty{
  text-align:center;padding:34px 22px;
  background:var(--card);border:1px dashed var(--line);
  border-radius:var(--radius);color:var(--muted);
}
.empty .ic{margin:0 auto 12px;color:var(--faint-2)}
.empty b{display:block;font-size:14.5px;color:var(--ink-2);font-weight:600;margin-bottom:5px}
.empty p{font-size:13px;margin:0;line-height:1.75}
.empty .btn{margin-top:16px}

/* ---------- 我的 ---------- */
.me-head{
  display:flex;align-items:center;gap:14px;margin:4px 2px 18px;
}
.me-avatar{
  flex:none;width:58px;height:58px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--brand-soft),var(--mist-soft));
  border:1px solid var(--brand-line);color:var(--brand-ink);
  font-size:20px;font-weight:700;
}
.me-head h1{margin:0;font-size:19px;line-height:1.4}
.me-head .sub{font-size:12.5px;color:var(--muted);margin:3px 0 0}
.set-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--line-2);
}
.set-row:last-child{border-bottom:none}
.set-row .sr-label{font-size:14.5px}
.set-row .sr-label small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.6}
.set-row .sr-val{font-size:13px;color:var(--muted);flex:none}

/* 开关 */
.switch{
  flex:none;width:46px;height:27px;border-radius:99px;background:var(--track);
  position:relative;transition:background .18s ease;
}
.switch::after{
  content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;
  background:var(--card);box-shadow:0 1px 3px rgba(70,62,50,.18);transition:transform .18s ease;
}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(19px)}

/* ---------- 15 题 ---------- */
.q-flow{max-width:var(--maxw);margin:0 auto}
.q-bar{
  height:2px;background:var(--track);border-radius:99px;overflow:hidden;margin:2px 0 22px;
}
.q-bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s ease}
.q-count{
  font-size:11.5px;letter-spacing:.18em;color:var(--muted);
  margin:0 0 10px;font-weight:600;
}
.q-text{font-size:19px;font-weight:600;line-height:1.65;margin:0 0 6px;letter-spacing:.01em}
.q-hint{font-size:12.5px;color:var(--muted);margin:8px 0 20px;line-height:1.7}
.q-opts{display:flex;flex-direction:column;gap:9px}
.q-opt{
  display:flex;align-items:flex-start;gap:11px;text-align:left;
  width:100%;padding:15px 15px;border-radius:var(--radius-sm);
  background:var(--card);border:1px solid var(--line);
  font-size:14.5px;line-height:1.65;color:var(--ink);
  transition:border-color .15s ease, background .15s ease, transform .08s ease;
}
.q-opt:active{transform:scale(.99)}
.q-opt .q-key{
  flex:none;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;
  background:var(--bg-2);color:var(--muted);
}
.q-opt.on{border-color:var(--brand);background:var(--brand-soft)}
.q-opt.on .q-key{background:var(--brand-ink);color:var(--on-brand)}
.q-text-input{width:100%;min-height:96px}
.q-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.q-nav .link{padding:10px 4px}

/* 完成页 */
.done-head{text-align:center;padding:14px 4px 6px}
.done-head h2{font-size:23px;margin:10px 0 6px;line-height:1.4}
.done-head p{font-size:13.5px;color:var(--ink-2);margin:0;line-height:1.8}
.done-mark{
  width:62px;height:62px;border-radius:50%;margin:0 auto 6px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--brand-soft),var(--mist-soft));
  color:var(--brand-ink);border:1px solid var(--brand-line);
}
.rec-sec{margin:0 0 16px}
.rec-sec h3{
  font-size:12px;letter-spacing:.14em;color:var(--muted);
  margin:0 0 7px;font-weight:600;
}
.rec-sec p{margin:0;font-size:14.5px;line-height:1.85;color:var(--ink-2)}
.rec-sec.quote p{
  font-size:15px;color:var(--ink);background:var(--brand-soft-2);
  border-left:3px solid var(--brand-line);border-radius:0 12px 12px 0;
  padding:12px 15px;line-height:1.85;
}
.rec-dims{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}

/* =========================================================================
   右栏卡片 / 手机内联卡片
   同一份 HTML 渲染两遍：手机放在正文流末尾（#view 内），
   ≥1180px 时手机那份 display:none、右栏那份出现。
   所以 .rail-card 必须是【全局】样式，不能只写在 1180 断点里。
   ========================================================================= */
.rail-card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px 16px;margin-bottom:14px;
}
.rail-card h4{
  margin:0 0 10px;font-size:12.5px;font-weight:600;
  letter-spacing:.06em;color:var(--ink-2);
  display:flex;align-items:center;gap:6px;
}
.rail-card h4 .ic{color:var(--faint)}
.rail-card .rail-note{font-size:12px;color:var(--muted);line-height:1.7;margin:8px 0 0}
.rail-card .statrow{margin-top:0}
.rail-quiet{
  font-size:12px;color:var(--faint);line-height:1.9;
  padding:6px 4px 0;text-align:center;
}
.rail-mobile{margin-top:4px}

/* ---------- 昵称 ---------- */
.nick-wrap{max-width:440px;margin:0 auto;padding-top:22px}
.nick-mark{
  width:64px;height:64px;border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--brand-soft),var(--warm-soft));
  color:var(--brand-ink);border:1px solid var(--brand-line);
}
.nick-wrap h2{font-size:22px;margin:0 0 8px;text-align:center;line-height:1.45}
.nick-wrap .nick-sub{
  font-size:13.5px;color:var(--ink-2);text-align:center;
  margin:0 0 22px;line-height:1.8;
}
.nick-wrap input{
  width:100%;border:1px solid var(--line);background:var(--field);
  border-radius:14px;padding:14px 15px;font-size:16px;outline:none;
  text-align:center;letter-spacing:.04em;
}
.nick-wrap input:focus{border-color:var(--brand-line);background:var(--card)}
.nick-wrap .btn{margin-top:16px}

/* ---------- 成长评估（旧 5 题，退役中，样式保留） ---------- */
.assess .page-intro{font-size:15px;line-height:1.8}
.assess-top{text-align:center;margin:6px 0 4px}
.assess-top h2{font-size:22px;margin:8px 0 2px}
.scale-legend{
  display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
  margin:6px 2px 14px;
}
.aq{padding-top:16px}
.aq-no{font-size:11px;color:var(--warm-ink);letter-spacing:.2em;margin:0}
.aq-text{font-size:15.5px;font-weight:600;margin:4px 0 12px;line-height:1.6}
.scale{display:flex;gap:6px}
.sc{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 0 6px;border:1px solid var(--line);border-radius:12px;
  background:var(--field);font-size:10px;color:var(--muted);
}
.sc b{font-size:15px;color:var(--ink-2)}
.sc.on{background:var(--brand-ink);border-color:var(--brand-ink)}
.sc.on b,.sc.on span{color:var(--on-brand)}

/* =========================================================================
   断点
   ========================================================================= */
@media (min-width:600px){
  body{background:
    radial-gradient(1200px 600px at 15% -10%, var(--glow) 0, transparent 60%),
    var(--bg);
    background-attachment:fixed;}
}

/* —— 左栏出现：桌面形态 —— */
@media (min-width:900px){
  #app{
    display:grid;
    /* minmax(0,1fr) 不是 1fr：1fr 等于 minmax(auto,1fr)，不会收缩到内容宽度以下，
       横向时间轴会把整页撑出横向滚动条 */
    grid-template-columns:var(--rail-w) minmax(0,1fr);
    gap:0 30px;
    max-width:1140px;
    margin:0 auto;
    padding:0 26px;
    align-items:start;
  }
  #rail{
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
    /* dvh：100vh 会把 iOS 地址栏那块也算进去，左侧栏因此比屏幕高出一截，
       底部「不是变成更好的人…」那句会被推到看不见的地方 */
    height:100dvh;
    padding:28px 0 26px;overflow-y:auto;
  }
  #rail2{display:none}
  #tabbar{display:none}
  /* 示例模式：横幅把左栏整体推下来（详见 #demoBar 那段） */
  body.demo-on #rail{top:var(--demoh);height:calc(100dvh - var(--demoh))}
  main#view{max-width:none;margin:0;padding:6px 0 72px}

  /* 顶栏在桌面降为一条细面包屑，但【位置不变】—— #btnBack 仍是返回的唯一入口 */
  #topbar{
    height:52px;justify-content:flex-start;
    padding:0 0;
    background:var(--bg);
    background:color-mix(in srgb, var(--bg) 86%, transparent);
  }

<script>
/* =========================================================================
 * 成长空间 · 通用 UI 小工具（无依赖）
 * ========================================================================= */
(function () {
  "use strict";

  function $(s, root) { return (root || document).querySelector(s); }
  function $all(s, root) { return Array.prototype.slice.call((root || document).querySelectorAll(s)); }

  /* 转义，防止用户输入内容被当作 HTML 渲染 */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  /* 本地日期 YYYY-MM-DD */
  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dateToStr(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function dayBefore(str) {
    var d = new Date(str + "T00:00:00");
    d.setDate(d.getDate() - 1);
    return dateToStr(d);
  }
  /* 显示友好日期：今天/昨天/M月d日 */
  function friendlyDate(str) {
    var t = today();
    if (str === t) return "今天";
    if (str === dayBefore(t)) return "昨天";
    var p = str.split("-");
    return parseInt(p[1], 10) + "月" + parseInt(p[2], 10) + "日";
  }
  function friendlyTime(ts) {
    var d = new Date(ts);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  /* 轻提示 */
  var toastTimer = null;
  function toast(msg) {
    var t = $("#toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  /* 课程序号：两位补零的唯一入口。
     以前散在 course.js 的 ('0' + order) 与 route.js 的 (order < 10 ? "0" : "")，
     课程超过 9 节后会渲染成 "010"，收拢到这里统一处理。 */
  function courseNo(n) {
    n = Number(n) || 0;
    return (n < 10 ? "0" : "") + n;
  }

  var WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  function weekday(dateStr) {
    var d = dateStr ? new Date(dateStr + "T00:00:00") : new Date();
    return WEEK[d.getDay()];
  }

  /* 2026.09.17 —— 参考图里日期都用点分隔 */
  function dotDate(dateStr) {
    var p = String(dateStr || today()).split("-");
    if (p.length < 3) return dateStr || "";
    return p[0] + "." + p[1] + "." + p[2];
  }

  /* 图标：转发给 ICONS，ICONS 未加载时安全降级为空串 */
  function icon(name, size) {
    return (window.ICONS && window.ICONS.icon) ? window.ICONS.icon(name, size) : "";
  }

  /* 转义后保留换行（用户写的多行文本、记录正文用） */
  function textLines(s) {
    return esc(s).replace(/\n/g, "<br>");
  }

  window.UI = {
    $: $, $all: $all, el: el, esc: esc,
    today: today, pad: pad, dateToStr: dateToStr, dayBefore: dayBefore,
    friendlyDate: friendlyDate, friendlyTime: friendlyTime, toast: toast,
    courseNo: courseNo, weekday: weekday, dotDate: dotDate,
    icon: icon, textLines: textLines
  };
})();
</script>

<script>
/* =========================================================================
 * 成长空间 · 本地数据层（LocalStorage，key 前缀 gs.）
 * 所有用户数据只保存在当前浏览器里，不联网、不上传。
 * ========================================================================= */
(function () {
  "use strict";

  var PREFIX = "gs.";
  var KEYS = {
    profile: "profile", progress: "progress", journal: "journal", practices: "practices",
    favorites: "favorites", settings: "settings"
  };

  /* ---- 示例模式 ---------------------------------------------------------
     非 null 时，读写全部改道到这个内存对象，LocalStorage 一次都不碰。
     这两个函数是整个 App 唯一的存储出入口，所以只在这里拦一次，
     十个页面就都进了示例模式，不需要每个页面各写一份示例分支。

     为什么是「可写的内存副本」而不是「只读」：
       只读的话，朋友点一下心情、写一句小记都没反应，会以为坏了；
       而写进真实存储又会污染他自己的数据。
       内存副本两头都占：点得动，退出即消失。

     为什么它同时是 iOS 的兜底：
       iOS 上 localStorage 有可能整个不可用。那种情况下普通模式是
       「能用但存不住」，而示例模式本来就不用存储，反而是完整的。 */
  var demoState = null;

  function raw(k) { return PREFIX + k; }
  function loadJson(k, def) {
    if (demoState) {
      var d = demoState[k];
      return d === undefined ? def : d;
    }
    try {
      var v = JSON.parse(localStorage.getItem(raw(k)));
      return v == null ? def : v;
    } catch (e) { return def; }
  }
  function saveJson(k, v) {
    if (demoState) { demoState[k] = v; return; }
    try { localStorage.setItem(raw(k), JSON.stringify(v)); } catch (e) { /* 隐私/容量异常时静默 */ }
  }

  function getProfile() { return loadJson(KEYS.profile, null); }
  function saveProfile(p) { saveJson(KEYS.profile, p); }

  function progress() { return loadJson(KEYS.progress, {}); }
  function saveProgress(o) { saveJson(KEYS.progress, o); }
  function journal() { return loadJson(KEYS.journal, []); }
  function practices() { return loadJson(KEYS.practices, []); }

  function courseState(id) {
    var p = progress()[id];
    return p ? p.status : "none";
  }
  function isDone(id) { return courseState(id) === "done"; }
  function markStarted(id) {
    var p = progress();
    if (!p[id] || p[id].status !== "done") {
      if (!p[id]) p[id] = { status: "started", startedAt: Date.now() };
    }
    saveProgress(p);
  }

  /* 新增一条成长记录（时间线用）。type: assessment / course / practice
     返回写入的那一条 —— 完成页要拿它的 id 跳去「回看完整记录」。 */
  function addJournal(type, note, meta) {
    var j = journal();
    var d = new Date();
    var e = {
      id: "j" + d.getTime() + Math.floor(Math.random() * 1000),
      date: UI.today(), ts: d.getTime(), type: type, note: note || "", meta: meta || {}
    };
    j.push(e);
    j.sort(function (a, b) { return a.ts - b.ts; });
    saveJson(KEYS.journal, j);
    return e;
  }

  /* 记录一次“今日练习” */
  function addPractice(courseId, note) {
    var arr = practices();
    var d = new Date();
    arr.push({ id: courseId + "-" + d.getTime(), courseId: courseId, note: note || "", date: UI.today(), ts: d.getTime() });
    arr.sort(function (a, b) { return b.ts - a.ts; });
    saveJson(KEYS.practices, arr);
  }

  /* 完成一节课程：写进度 + 练习 + 成长记录 */
  function completeCourse(courseId, payload) {
    payload = payload || {};
    var p = progress();
    p[courseId] = { status: "done", finishedAt: Date.now() };
    saveProgress(p);
    if (!payload.noPractice) addPractice(courseId, payload.practiceNote);
    addJournal("course", "完成课程《" + courseTitle(courseId) + "》", {
      courseId: courseId,
      reflections: payload.reflections || []
    });
  }

  /* 已完成后，再次做练习/反思：只追加记录，不改完成状态 */
  function logSession(courseId, payload) {
    payload = payload || {};
    addPractice(courseId, payload.practiceNote);
    addJournal("practice", "重做练习《" + courseTitle(courseId) + "》", { courseId: courseId });
  }

  function courseTitle(id) {
    var c = window.COURSES && COURSES.filter(function (x) { return x.id === id; })[0];
    return c ? c.title : "";
  }

  /* =======================================================================
   * 昵称（存在 profile 里，不另开 key）
   * ===================================================================== */
  function nickname() {
    var p = getProfile();
    return (p && p.nickname) || "";
  }
  /* 保存昵称。注意【不要】顺手把 done 设成 true —— 昵称和自评是两件事 */
  function saveNickname(n) {
    var p = getProfile() || { done: false, startedAt: Date.now() };
    p.nickname = String(n == null ? "" : n).replace(/^\s+|\s+$/g, "").slice(0, 12);
    p.nicknameSetAt = Date.now();
    saveProfile(p);
    return p.nickname;
  }

  /* =======================================================================
   * 今日小记 / 心情
   * 都写进 journal（它本就是按时序追加的行为流，streak / thisWeek 都从它派生），
   * 但【每天一条】—— 所以走 upsertToday，避免改主意重写时留下两条。
   * ===================================================================== */
  function upsertToday(type, note, meta) {
    var j = journal(), td = UI.today(), i;
    for (i = 0; i < j.length; i++) {
      if (j[i].type === type && j[i].date === td) {
        j[i].note = note || "";
        j[i].meta = meta || {};
        j[i].ts = Date.now();
        saveJson(KEYS.journal, j);
        return false;             /* 改写，不是新建 */
      }
    }
    addJournal(type, note, meta);  /* 复用现有函数，排序逻辑一起复用 */
    return true;                   /* 新建 */
  }

  function todayEntry(type) {
    var j = journal(), td = UI.today();
    for (var i = j.length - 1; i >= 0; i--) {
      if (j[i].type === type && j[i].date === td) return j[i];
    }
    return null;
  }

  function saveDailyNote(text) {
    return upsertToday("note", String(text == null ? "" : text).replace(/^\s+|\s+$/g, ""), {});
  }
  function saveMood(moodId, score, label) {
    return upsertToday("mood", "", { moodId: moodId, score: score, label: label || "" });
  }

  /* 近 N 天心情序列；没记录的日子是 null（曲线断开，不连线） */
  function moodSeries(days) {
    days = days || 14;
    var j = journal(), map = {}, i;
    for (i = 0; i < j.length; i++) {
      if (j[i].type === "mood" && j[i].meta && j[i].meta.score) map[j[i].date] = j[i].meta.score;
    }
    var out = [], cur = UI.today();
    for (i = 0; i < days; i++) {
      out.unshift({ date: cur, score: map[cur] || null });
      cur = UI.dayBefore(cur);
    }
    return out;
  }

  /* 按类型取记录，新的在前 */
  function entries(type) {
    var j = journal(), out = [];
    for (var i = j.length - 1; i >= 0; i--) if (j[i].type === type) out.push(j[i]);
    return out;
  }

  /* =======================================================================
   * journal -> 时间轴展示项
   * 首页和「成长轨迹」读的是同一份映射，不是两份要同步维护的代码。
   *
   * opts.maxMood：只在【摘要】里限制心情条目的条数（-1 = 不限，默认）。
   *
   * 为什么需要它：心情每天都能记，小记和课程不是。记得越勤，摘要就越被
   * 「心情 · 还不错」这种没有内容的行占满，而完成一节课、写下的一句话
   * 全被挤到看不见的地方 —— 那正好和这条时间轴的意义相反。
   *
   * 为什么是「限制总数」而不是「不许连着出两条」：
   *   试过后者。示例数据是心情与小记交替的，连着出的规则会把
   *   心情 · 小记 · 心情 · 小记 一路放行，8 条里仍然有 4 条是心情，
   *   两节已完成的课照样进不来 —— 等于没治。限总数才真的把位置让出来。
   *
   * 「成长轨迹」页取的是全量（limit=0），一条不删、不做任何取舍。
   * ===================================================================== */
  function timelineItems(limit, opts) {
    var maxMood = (opts && opts.maxMood !== undefined) ? opts.maxMood : -1;
    var moods = 0;
    var j = journal(), out = [];
    for (var i = j.length - 1; i >= 0; i--) {
      var e = j[i], meta = e.meta || {}, item;
      var k;

      if (e.type === "assessment") {
        var rec = meta.record;
        item = {
          title: e.note || (rec ? rec.title : "认识自己"),
          quote: rec ? rec.quote : "",
          kind: "assessment",
          /* 只有那条《第一次认识自己》可点开回看 */
          refId: meta.kind === "first-self" ? e.id : ""
        };
      } else if (e.type === "course") {
        var rs = meta.reflections || [], q = "";
        for (k = 0; k < rs.length; k++) {
          if (rs[k] && rs[k].a) { q = rs[k].a; break; }
        }
        item = { title: e.note || "完成了一节课", quote: q, kind: "course", refId: "" };
      } else if (e.type === "mood") {
        /* 超出的心情直接跳过，把位置留给后面的小记和课程。
           这里用 continue 而不是 break —— break 会让整个列表提前结束。 */
        if (maxMood >= 0 && moods >= maxMood) continue;
        moods++;
        item = { title: meta.label ? "心情 · " + meta.label : "记录了一次心情", quote: "", kind: "mood", refId: "" };
      } else if (e.type === "note") {
        item = { title: "今日小记", quote: e.note || "", kind: "note", refId: "" };
      } else {
        item = { title: e.note || "一条记录", quote: "", kind: e.type, refId: "" };
      }

      item.date = e.date;
      item.day = UI.dotDate(e.date).slice(5);
      item.ts = e.ts;
      out.push(item);
      if (limit && out.length >= limit) break;
    }
    return out;
  }

  /* =======================================================================
   * 收藏 / 设置 / 探索过的主题
   * ===================================================================== */
  function favorites() { return loadJson(KEYS.favorites, []); }
  function isFav(id) { return favorites().indexOf(id) !== -1; }
  function toggleFav(id) {
    var f = favorites(), i = f.indexOf(id);
    if (i === -1) f.push(id); else f.splice(i, 1);
    saveJson(KEYS.favorites, f);
    return i === -1;              /* true = 刚收藏 */
  }

  function settings() {
    var s = loadJson(KEYS.settings, null) || {};
    if (!s.remind) s.remind = { on: false, time: "20:00" };
    if (!s.explored) s.explored = [];
    return s;
  }
  function saveSettings(s) { saveJson(KEYS.settings, s); }

  /* 记录「看过某个探索入口」。刻意不写进 journal ——
     浏览入口不算成长活动，不该影响连续天数。 */
  function markExplored(topicId) {
    var s = settings();
    if (s.explored.indexOf(topicId) === -1) {
      s.explored.push(topicId);
      saveSettings(s);
    }
  }

  /* =======================================================================
   * 15 题：保存答案 + 生成《第一次认识自己》
   * ===================================================================== */
  function saveAssessment(answers) {
    var rec = window.Record.build(answers);
    var p = getProfile() || { done: false, startedAt: Date.now() };
    p.done = true;
    p.answers = answers;
    p.answersVersion = 2;         /* 2 = 15 题版；老数据是 1 */
    p.portrait = rec;
    p.revisedAt = Date.now();
    saveProfile(p);
    rec.entryId = addJournal("assessment", rec.title, { kind: rec.kind, record: rec }).id;
    return rec;
  }

  /* 那条「第一次认识自己」 */
  function firstRecord() {
    var j = journal();
    for (var i = 0; i < j.length; i++) {
      if (j[i].type === "assessment" && j[i].meta && j[i].meta.kind === "first-self") return j[i];
    }
    return null;
  }

  /* 老数据的答案版本；没有 profile 或没做过题时返回 0 */
  function answersVersion() {
    var p = getProfile();
    if (!p || !p.answers) return 0;
    return p.answersVersion === undefined ? 1 : p.answersVersion;
  }

  /* 把老用户标成 v1。只加一个标记字段，绝不动 answers / portrait */
  function migrate() {
    var p = getProfile();
    if (p && p.answersVersion === undefined) {
      p.answersVersion = p.answers ? 1 : 0;
      saveProfile(p);
    }
  }

  /* ---- 示例模式开关（见上面 demoState 的说明）---- */
  function isDemo() { return demoState !== null; }
  function startDemo() { demoState = window.DemoData.build(); }
  /* 只是把指针放回 null。示例数据是内存里的对象，没有引用就回收了，
     真实数据从头到尾没被碰过 —— 所以「退出示例」不需要恢复任何东西。 */
  function stopDemo() { demoState = null; }

  /* ---- 统计 ---- */
  function doneIds() {
    var p = progress(), out = [];
    for (var k in p) if (p.hasOwnProperty(k) && p[k].status === "done") out.push(k);
    return out;
  }
  function nextCourseId() {
    var cs = window.COURSES || [];
    for (var i = 0; i < cs.length; i++) if (!isDone(cs[i].id)) return cs[i].id;
    return null;
  }
  function practiceDistinct() {
    var arr = practices(), set = {};
    for (var i = 0; i < arr.length; i++) set[arr[i].courseId] = true;
    return Object.keys(set).length;
  }
  /* 连续学习天数：从今天(或昨天)往前数连续有记录的天数 */
  function streak() {
    var j = journal(), set = {}, has = function (s) { return !!set[s]; };
    for (var i = 0; i < j.length; i++) set[j[i].date] = true;
    if (!j.length) return 0;
    var cur = UI.today(), count = 0;
    if (!has(cur)) cur = UI.dayBefore(cur);   // 今天还没记录时，从昨天算起，不断签
    while (has(cur)) { count++; cur = UI.dayBefore(cur); }
    return count;
  }
  /* 写过小记的天数（去重日期） */
  function noteDays() {
    var j = journal(), set = {}, n = 0;
    for (var i = 0; i < j.length; i++) {
      if (j[i].type === "note" && !set[j[i].date]) { set[j[i].date] = true; n++; }
    }
    return n;
  }
  /* 近 N 天记过心情的天数。
     这里刻意【不】提供均值：一个 3.1 这样的分数，会让人开始比较
     「这个月是不是比上个月差」，而起伏本来就该由曲线去说。
     数次数是中性的，打分不是。 */
  function moodDays(days) {
    var s = moodSeries(days), n = 0;
    for (var i = 0; i < s.length; i++) if (s[i].score) n++;
    return n;
  }

  function stats() {
    var ids = doneIds();
    var total = (window.COURSES || []).length;
    var thisWeek = 0, td = UI.today(), j = journal();
    var weekAgo = new Date();
    weekAgo.setDate(weekAgo.getDate() - 7);
    for (var i = 0; i < j.length; i++) if (j[i].ts >= weekAgo.getTime()) thisWeek++;
    var todayActive = j.some(function (e) { return e.date === td; });
    var fr = firstRecord();

    return {
      /* 原有字段：很多页面在读，一个都不能改 */
      coursesTotal: total,
      coursesDone: ids.length,
      practiceDone: practiceDistinct(),
      streak: streak(),
      thisWeek: thisWeek,
      todayActive: todayActive,

      /* 新增 */
      recordCount: j.length,
      noteDays: noteDays(),
      moodDays30: moodDays(30),
      favCount: favorites().length,
      exploreCount: settings().explored.length,
      hasFirstRecord: !!fr,
      firstRecordTs: fr ? fr.ts : 0
    };
  }

  function resetAll() {
    try {
      localStorage.removeItem(raw(KEYS.profile));
      localStorage.removeItem(raw(KEYS.progress));
      localStorage.removeItem(raw(KEYS.journal));
      localStorage.removeItem(raw(KEYS.practices));
      localStorage.removeItem(raw(KEYS.favorites));
      localStorage.removeItem(raw(KEYS.settings));
    } catch (e) {}
  }

  window.Store = {
    getProfile: getProfile, saveProfile: saveProfile,
    journal: journal, practices: practices,
    progress: progress,
    courseState: courseState, isDone: isDone, markStarted: markStarted,
    addJournal: addJournal, addPractice: addPractice,
    completeCourse: completeCourse, logSession: logSession,
    doneIds: doneIds, nextCourseId: nextCourseId,
    practiceDistinct: practiceDistinct, streak: streak, stats: stats,
    resetAll: resetAll,

    /* 示例模式 */
    isDemo: isDemo, startDemo: startDemo, stopDemo: stopDemo,

    /* 昵称 */
    nickname: nickname, saveNickname: saveNickname,
    /* 小记 / 心情 */
    upsertToday: upsertToday, todayEntry: todayEntry,
    saveDailyNote: saveDailyNote, saveMood: saveMood,
    moodSeries: moodSeries, moodDays: moodDays, entries: entries,
    timelineItems: timelineItems,
    /* 收藏 / 设置 / 探索记录 */
    favorites: favorites, isFav: isFav, toggleFav: toggleFav,
    settings: settings, saveSettings: saveSettings, markExplored: markExplored,
    /* 15 题 */
    saveAssessment: saveAssessment, firstRecord: firstRecord,
    answersVersion: answersVersion, migrate: migrate
  };
})();
</script>
<script>
/* =========================================================================
 * 成长空间 · 路由与页面切换
 * -------------------------------------------------------------------------
 * 页面由 window.Pages[name] 提供：
 *   { title?, render(params)->html, bind(viewEl, params),
 *     rail?(params)->html, bindRail?(railEl, params),   // 可选右栏（宽屏）
 *     hideTab?, hideBar? }                              // 整屏页用
 *
 * 导航只有一份数据源 TABS：桌面侧栏与手机底栏都由它生成，
 * 将来改名 / 调顺序只改这里一处。
 * ========================================================================= */
(function () {
  "use strict";

  var TABS = [
    { id: "home",    label: "首页",     icon: "home" },
    { id: "trace",   label: "成长轨迹", icon: "path" },
    { id: "notes",   label: "记录",     icon: "pen" },
    { id: "explore", label: "探索",     icon: "compass" },
    { id: "me",      label: "我的",     icon: "user" }
  ];

  var TAB_NAMES = {};
  for (var t = 0; t < TABS.length; t++) TAB_NAMES[TABS[t].id] = TABS[t].label;

  var state = { tab: "home", stack: [] };

  function isTab(name) { return TAB_NAMES.hasOwnProperty(name); }

  /* ---- 导航渲染：两个容器共用一份数据 ---- */
  function buildNav(host) {
    if (!host) return;
    var h = [];
    for (var i = 0; i < TABS.length; i++) {
      h.push('<button class="tab" data-nav="' + TABS[i].id + '" type="button">' +
        UI.icon(TABS[i].icon, 20) + "<span>" + TABS[i].label + "</span></button>");
    }
    host.innerHTML = h.join("");
    /* 事件委托：整个容器一个监听。
       逐按钮绑的话，将来重建导航（换顺序/换文案）监听会全部丢失。 */
    host.addEventListener("click", function (e) {
      var b = e.target;
      while (b && b !== host) {
        if (b.getAttribute && b.getAttribute("data-nav")) {
          navigate(b.getAttribute("data-nav"));
          return;
        }
        b = b.parentNode;
      }
    });
  }

  function render(name, params) {
    var page = window.Pages[name];
    if (!page) { name = "home"; page = window.Pages.home; }
    params = params || {};

    var v = UI.$("#view");
    v.innerHTML = page.render(params);
    if (page.bind) page.bind(v, params);

    /* ---- 右栏：容器在外壳，内容由页面填 ----
       必须【无条件先清空】：漏了这一步，用户会带着首页的「今日小记」
       出现在成长轨迹页。 */
    var rail2 = UI.$("#rail2");
    if (rail2) {
      rail2.innerHTML = page.rail ? page.rail(params) : "";
      if (page.rail && page.bindRail) page.bindRail(rail2, params);
    }
    document.body.classList.toggle("has-rail", !!page.rail);

    /* ---- 顶栏 ---- */
    var hideBar = !!page.hideBar;
    var topbar = UI.$("#topbar");
    if (topbar) topbar.classList.toggle("hidden", hideBar);
    var back = UI.$("#btnBack");
    if (back) back.classList.toggle("hidden", isTab(name));
    var titleEl = UI.$("#pageTitle");
    if (titleEl) {
      var tt = (typeof page.title === "function" ? page.title(params) : page.title);
      titleEl.textContent = tt || TAB_NAMES[name] || "成长空间";
    }
    document.body.classList.toggle("no-bar", hideBar);

    /* ---- 底部导航 / 侧栏 ---- */
    var hideTab = !!page.hideTab;
    document.body.classList.toggle("no-tab", hideTab);
    var tabbar = UI.$("#tabbar");
    if (tabbar) tabbar.classList.toggle("hidden", hideTab);

    var navs = UI.$all("[data-nav]");
    for (var i = 0; i < navs.length; i++) {
      navs[i].classList.toggle("on", navs[i].getAttribute("data-nav") === name);
    }

    window.scrollTo(0, 0);
    if (window.afterNav) window.afterNav(name, params);
    state.current = { name: name, params: params };
    return state.current;
  }

  /* page.enter 只在【用户主动进入】时调用，页面自己调 render() 重绘时不调。
     15 题那种「一页多步」的流程靠它复位，否则第二次进来会停在完成页。 */
  function enter(name, params) {
    var page = window.Pages[name];
    if (page && page.enter) page.enter(params || {});
  }

  function navigate(name, params) {
    if (isTab(name)) { state.tab = name; state.stack = []; }
    else { state.stack.push({ name: name, params: params || {} }); }
    enter(name, params);
    return render(name, params);
  }

  function back() {
    var target;
    if (state.stack.length) state.stack.pop();
    if (state.stack.length) {
      var top = state.stack[state.stack.length - 1];
      target = top;
    } else {
      target = { name: state.tab, params: {} };
    }
    enter(target.name, target.params);
    return render(target.name, target.params);
  }

  function current() { return state.current || { name: state.tab }; }

  function init() {
    buildNav(UI.$("#tabbar"));
    buildNav(UI.$("#railNav"));
    var back = UI.$("#btnBack");
    if (back) back.addEventListener("click", function () { Router.back(); });
  }

  window.Router = {
    TABS: TABS, TAB_NAMES: TAB_NAMES,
    navigate: navigate, back: back, render: render, init: init, current: current,
    isTab: isTab
  };
})();
</script>
<script>
/* =========================================================================
 * 成长空间 · 共享渲染组件
 * -------------------------------------------------------------------------
 * 一次抽取、多处复用：课程行、时间轴、心情曲线。
 * 「成长轨迹」用纵向时间轴，首页用横向——是同一份数据、两种排布，
 * 不是两份要同步维护的代码。
 * ========================================================================= */
(function () {
  "use strict";

  /* ---------------------------------------------------------------------
   * 课程行
   * ------------------------------------------------------------------- */
  function lessonRow(c, opts) {
    opts = opts || {};
    var done = Store.isDone(c.id);
    var started = Store.courseState(c.id) === "started";
    var label = done ? "已完成" : started ? "继续" : "开始";
    var fav = Store.isFav(c.id);
    return '<div class="lesson-row' + (done ? " done" : "") + '" data-go-lesson="' + c.id + '" role="button" tabindex="0">' +
      '<span class="lr-no">' + UI.courseNo(c.order) + "</span>" +
      '<div class="lr-text"><b>' + UI.esc(c.title) + "</b>" +
      '<span class="muted small">预计 ' + c.minutes + " 分钟" + (done ? " · 已完成" : "") + "</span></div>" +
      (opts.showFav === false ? "" :
        '<button class="lr-fav' + (fav ? " on" : "") + '" data-fav="' + c.id + '" ' +
        'aria-label="' + (fav ? "取消收藏" : "收藏") + '" title="' + (fav ? "取消收藏" : "收藏") + '">' +
        UI.icon("star", 16) + "</button>") +
      '<span class="lr-cta">' + label + " " + UI.icon("chevron", 14) + "</span></div>";
  }

  /* 课程 id 列表 -> 课程行列表 */
  function lessonList(ids) {
    var h = [];
    for (var i = 0; i < ids.length; i++) {
      var c = (window.Course && Course.byId) ? Course.byId(ids[i]) : null;
      if (c) h.push(lessonRow(c));
    }
    return h.join("");
  }

  /* ---------------------------------------------------------------------
   * 时间轴
   * items: [{ date, day, title, quote, kind, refId, ts }]
   * opts.layout: "v" 纵向（成长轨迹页/手机） | "h" 横向（首页宽屏）
   * ------------------------------------------------------------------- */
  function timeline(items, opts) {
    opts = opts || {};
    if (!items || !items.length) return "";
    var layout = opts.layout === "h" ? "h" : "v";
    var h = ['<ol class="tl tl-' + layout + '">'];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      h.push('<li class="tl-item' + (it.kind ? " k-" + it.kind : "") + '"' +
        (it.refId ? ' data-record="' + UI.esc(it.refId) + '" role="button" tabindex="0"' : "") + ">" +
        '<span class="tl-dot" aria-hidden="true"></span>' +
        '<span class="tl-date">' + UI.esc(it.day || UI.dotDate(it.date).slice(5)) + "</span>" +
        '<b class="tl-title">' + UI.esc(it.title) + "</b>" +
        (it.quote ? '<p class="tl-quote">' + UI.esc(it.quote) + "</p>" : "") +
        "</li>");
    }
    h.push("</ol>");
    /* 横向时间轴必须自带滚动容器 —— 否则会把桌面栅格撑爆，整页出现横向滚动条 */
    return layout === "h" ? '<div class="tl-scroll">' + h.join("") + "</div>" : h.join("");
  }

  /* ---------------------------------------------------------------------
   * 心情曲线（近 N 天）
   * 手写 SVG，不引入任何图表库：file:// + 微信分发场景下 CDN 是死路。
   * 缺数据的日子断开、不连线。stroke 用 CSS 变量，换色板时自动跟随。
   * ------------------------------------------------------------------- */
  function moodSvg(series, opts) {
    opts = opts || {};
    var W = 300, H = opts.height || 84, PAD = 8;
    if (!series || series.length < 2) return "";
    var segs = [], seg = [], dots = [], i;
    var last = series.length - 1;

    for (i = 0; i < series.length; i++) {
      var s = series[i].score;
      if (!s) {
        /* 没记录的日子断开 —— 但线段至少要有两个点才画 */
        if (seg.length > 1) segs.push(seg.join(" "));
        seg = [];
        continue;
      }
      var x = Math.round(i * (W / last));
      var y = Math.round(H - PAD - ((s - 1) / 4) * (H - PAD * 2));
      seg.push(x + "," + y);
      /* 每个记录点都留一个圆点。
         只画线不画点的话，三三两两的短线段看起来就是几道游离的斜杠，
         读不出「这是我留下的记录」—— 点才是这条曲线的锚。 */
      dots.push('<circle cx="' + x + '" cy="' + y + '" r="2.6" fill="currentColor"/>');
    }
    if (seg.length > 1) segs.push(seg.join(" "));
    if (!dots.length) return "";

    var out = ['<svg class="mood-curve" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" aria-hidden="true">'];
    /* 底线：给悬浮的圆点一个参照，否则整条曲线像是飘在卡片中间 */
    out.push('<line x1="0" y1="' + (H - PAD) + '" x2="' + W + '" y2="' + (H - PAD) +
      '" stroke="currentColor" stroke-width="1" opacity=".16"/>');
    for (i = 0; i < segs.length; i++) {
      out.push('<polyline points="' + segs[i] + '" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>');
    }
    out.push(dots.join(""));
    out.push("</svg>");
    return out.join("");
  }

  /* 心情曲线下方的日期刻度（只显示首尾与中间） */
  function moodAxis(series) {
    if (!series || !series.length) return "";
    var idx = [0, Math.floor((series.length - 1) / 2), series.length - 1];
    var h = ['<div class="mood-axis">'];
    for (var i = 0; i < 3; i++) {
      h.push("<span>" + UI.dotDate(series[idx[i]].date).slice(5) + "</span>");
    }
    h.push("</div>");
    return h.join("");
  }

  /* ---------------------------------------------------------------------
   * 事件绑定（统一入口，避免每个页面各写一份）
   * ------------------------------------------------------------------- */
  function bindLessonRows(root) {
    var rows = UI.$all("[data-go-lesson]", root);
    for (var i = 0; i < rows.length; i++) (function (b) {
      b.addEventListener("click", function (e) {
        /* 收藏按钮在课程行内部，别把点击一起吞掉 */
        if (e.target && e.target.closest && e.target.closest("[data-fav]")) return;
        var id = b.getAttribute("data-go-lesson");
        Store.markStarted(id);
        Router.navigate("lesson", { id: id });
      });
    })(rows[i]);
  }

  function bindFav(root, onDone) {
    var btns = UI.$all("[data-fav]", root);
    for (var i = 0; i < btns.length; i++) (function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = b.getAttribute("data-fav");
        var now = Store.toggleFav(id);
        b.classList.toggle("on", now);
        var lab = now ? "取消收藏" : "收藏";
        b.setAttribute("aria-label", lab);
        b.setAttribute("title", lab);
        UI.toast(now ? "已收藏" : "已取消收藏");
        if (onDone) onDone(now);
      });
    })(btns[i]);
  }

  function bindFields(root) {
    var f = UI.$all("[data-field]", root);
    for (var i = 0; i < f.length; i++) (function (el) {
      el.addEventListener("input", function () {
        el.setAttribute("data-value", el.value);
      });
    })(f[i]);
  }

  /* 通用「跳到某页 / 某记录 / 某主题」 */
  function bindGo(root) {
    var g = UI.$all("[data-go]", root);
    for (var i = 0; i < g.length; i++) (function (b) {
      b.addEventListener("click", function () {
        Router.navigate(b.getAttribute("data-go"));
      });
    })(g[i]);

    var r = UI.$all("[data-record]", root);
    for (var j = 0; j < r.length; j++) (function (b) {
      b.addEventListener("click", function () {
        Router.navigate("record", { id: b.getAttribute("data-record") });
      });
    })(r[j]);

    var t = UI.$all("[data-topic]", root);
    for (var k = 0; k < t.length; k++) (function (b) {
      b.addEventListener("click", function () {
        Router.navigate("topic", { id: b.getAttribute("data-topic") });
      });
    })(t[k]);
  }

  /* 心情五档：score 只用来画曲线的高低，不是打分、不做评价。
     label 是给用户看的词，中性、不带褒贬。 */
  /* label 进数据与 aria（「心情 · 还算平静」），short 只给窄栏按钮用。
     右栏一张卡片 262px 放 5 个按钮，每个约 47px —— 4 个字必定折行。 */
  var MOODS = [
    { id: "m1", score: 1, label: "很低落", short: "低落", icon: "mood1" },
    { id: "m2", score: 2, label: "有点沉", short: "有点沉", icon: "mood2" },
    { id: "m3", score: 3, label: "还算平静", short: "平静", icon: "mood3" },
    { id: "m4", score: 4, label: "还不错", short: "还不错", icon: "mood4" },
    { id: "m5", score: 5, label: "挺好的", short: "挺好", icon: "mood5" }
  ];
  function moodById(id) {
    for (var i = 0; i < MOODS.length; i++) if (MOODS[i].id === id) return MOODS[i];
    return null;
  }

  window.Widgets = {
    lessonRow: lessonRow, lessonList: lessonList,
    timeline: timeline, moodSvg: moodSvg, moodAxis: moodAxis,
    bindLessonRows: bindLessonRows, bindFav: bindFav,
    bindFields: bindFields, bindGo: bindGo,
    MOODS: MOODS, moodById: moodById
  };
  /* 兼容旧引用（course.js / route.js 曾用全局函数） */
  window.bindLessonRows = bindLessonRows;
})();
</script>

    return null;

  /* 仅取选择题（用于维度统计） */
  function choiceQuestions() {

  window.QUESTIONNAIRE = {

<script>
/* =========================================================================
 * 成长空间 · 《第一次认识自己》记录生成
 * -------------------------------------------------------------------------
 * 由 15 题的【选择分布】生成一份温和的「记录式反馈」。
 *
 * 这不是评估，也不是结论：
 *   - 不计算“你是什么类型”，不给答案打分，不告诉用户哪个答案更好
 *   - 不做心理诊断，不出现任何医学 / 玄学判断
 *   - 使用简单的规则映射（对每个维度累加内部权重），不做复杂算法
 *   - 多个方向接近时，明确说“似乎同时在关注几个方向”，不强行给单一结论
 * ========================================================================= */
(function () {
  "use strict";

  /* 维度 -> 「我想继续了解的方向」的一句话 */
  var DIRECTION = {
    understand: "最近的自己，正在经历什么",
    emotion: "情绪来的时候，它到底想告诉我什么",
    relation: "在关系里，我真正的需要是什么",
    action: "想做的事，怎么才能真的开始",
    self: "我怎么看待自己，又是怎么和自己说话的",
    thinking: "我脑子里那些“理所当然”，是不是只有一种可能"
  };

  /* 做题时“被带走”程度越高，越说明这个方向此刻占着他/她的心 */
  var CARE_ORDER = ["understand", "emotion", "relation", "self", "action", "thinking"];

  /* ---- 维度统计：纯粹是选择分布的汇总，不是评分 ---- */
  function dimWeights(answers) {
    answers = answers || {};
    var qs = window.QUESTIONNAIRE.choiceQuestions();
    var byDim = {}, i, j;

    for (i = 0; i < qs.length; i++) {
      var q = qs[i];
      if (!q.dim) continue;
      var pick = findOption(q, answers[q.key]);
      if (!pick) continue;
      if (!byDim[q.dim]) byDim[q.dim] = { dim: q.dim, weight: 0, count: 0 };
      byDim[q.dim].weight += pick.tone;
      byDim[q.dim].count += 1;
    }

    var out = [];
    for (i = 0; i < CARE_ORDER.length; i++) {
      if (byDim[CARE_ORDER[i]]) out.push(byDim[CARE_ORDER[i]]);
    }
    /* 权重高的排前面；同权重时保持 CARE_ORDER 的稳定顺序 */
    out.sort(function (a, b) { return b.weight - a.weight; });
    return out;
  }

  function findOption(q, v) {
    if (v == null) return null;
    for (var i = 0; i < q.options.length; i++) if (q.options[i].v === v) return q.options[i];
    return null;
  }

  /* 取最突出的若干维度；与最高权重相差 <=1 的都算“同时在关注” */
  function topDims(dims, max) {
    if (!dims.length) return [];
    var top = dims[0].weight, out = [];
    for (var i = 0; i < dims.length && out.length < max; i++) {
      if (top - dims[i].weight > 1) break;
      if (dims[i].weight <= 0) break;
      out.push(dims[i].dim);
    }
    return out;
  }

  function names(dims, joinWord) {
    var out = [];
    for (var i = 0; i < dims.length; i++) out.push(window.QUESTIONNAIRE.dims[dims[i]] || dims[i]);
    return out.join(joinWord || "、");
  }

  /* ---- 各段文字 ---- */

  function stateText(answers) {
    var q1 = window.QUESTIONNAIRE.byKey("q1");
    var pick = q1 ? findOption(q1, answers.q1) : null;
    if (!pick) return "最近的你，开始愿意停下来看看自己。这件事本身，就已经是开始。";
    if (pick.tone === 0) {
      return "最近的你，对自己正在经历什么是比较清楚的。你知道自己走在什么样的路上，这让接下来的每一步都有个落脚点。";
    }
    if (pick.tone === 1) {
      return "最近的你，有些部分能感觉到，还有些部分暂时说不清。这很正常——说不清的地方，往往是还没被认真看过的地方。";
    }
    if (pick.tone === 2) {
      return "最近的你，好像常常被情绪或事情推着走，反应比觉察来得更快一些。这不代表你做错了什么，只是那几秒的间隙，还没被留出来。";
    }
    return "最近的你，好像有点不知道自己怎么了。在这样的时候还愿意坐下来回答问题，本身就是一次很温柔的自我照顾。";
  }

  function careText(dims, top) {
    if (!top.length) return "你还没有特别集中的方向。也许此刻更重要的，只是先允许自己停一停。";
    /* 空行是用 <br><br> 拼出来的，周围没有别的排版线索时，
       那个空档看起来不像「分段」，像「渲染漏了一块」——
       所以这里都收成单换行，改用一句话把方向讲完。 */
    if (top.length === 1) {
      return "最近的你，似乎正在更多地关注：\n" + names(top) + "。";
    }
    return "最近的你，似乎同时在关注几个方向：\n" + names(top) +
      "。\n它们不必同时解决，先挑一个最想看的就好。";
  }

  function noticeText(answers, dims) {
    var parts = [];

    var q2 = window.QUESTIONNAIRE.byKey("q2");
    var p2 = q2 ? findOption(q2, answers.q2) : null;
    if (p2) {
      if (p2.tone <= 1) parts.push("你能比较快地发现自己正在有什么情绪，这是很珍贵的能力。");
      else parts.push("你留意到，情绪往往是在反应之后才被认出来的。");
    }

    var q3 = window.QUESTIONNAIRE.byKey("q3");
    var p3 = q3 ? findOption(q3, answers.q3) : null;
    if (p3) {
      if (p3.tone === 0) parts.push("不舒服的时候，你会先停下来看看自己为什么不舒服。");
      else if (p3.tone === 3) parts.push("你写下的那种“表面没什么、之后一直想着”，说明有些情绪还在等你回头看看它。");
      else parts.push("你不舒服的时候会有反应，但之后愿意回头想一想。");
    }

    var q7 = window.QUESTIONNAIRE.byKey("q7");
    var p7 = q7 ? findOption(q7, answers.q7) : null;
    if (p7 && p7.tone >= 2) parts.push("对自己，你好像比对别人更严格一些。");
    else if (p7 && p7.tone === 0) parts.push("面对做得不好的地方，你能先接受它，再想办法调整。");

    if (!parts.length) parts.push("你愿意花几分钟，认真回答这些问题——这本身就是一次自我观察。");
    return parts.join("");
  }

  function directionText(top, dims) {
    var use = top.length ? top : [dims.length ? dims[0].dim : "understand"];
    var lines = [];
    for (var i = 0; i < use.length; i++) {
      var d = DIRECTION[use[i]];
      if (d) lines.push("· " + d);
    }
    if (!lines.length) return "· 最近的自己，正在经历什么";
    return lines.join("\n");
  }

  function futureText(answers) {
    var t = (answers && answers.q15) ? String(answers.q15).replace(/^\s+|\s+$/g, "") : "";
    if (!t) return "（这一句，你留给了自己。）";
    return t;
  }

  function changeText(answers) {
    var t = (answers && answers.q14) ? String(answers.q14).replace(/^\s+|\s+$/g, "") : "";
    if (!t) return "";
    return t;
  }

  /* ---- 组装 ---- */
  function build(answers) {
    answers = answers || {};
    var dims = dimWeights(answers);
    var top = topDims(dims, 3);
    var sections = [];

    sections.push({ k: "state", label: "我最近的状态", text: stateText(answers) });

    var change = changeText(answers);
    if (change) {
      sections.push({ k: "change", label: "我最近最想改变的", text: change });
    }

    sections.push({ k: "care", label: "我比较在意的事情", text: careText(dims, top) });
    sections.push({ k: "notice", label: "我注意到的自己", text: noticeText(answers, dims) });
    sections.push({ k: "direction", label: "我想继续了解的方向", text: directionText(top, dims) });
    sections.push({ k: "future", label: "我写给未来自己的话", text: futureText(answers) });

    return {
      kind: "first-self",
      title: "第一次认识自己",
      quote: "我开始认真看看最近的自己。",
      sections: sections,
      dims: top,
      dimNames: names(top)
    };
  }

  /* 完成页顶部的「此刻的你」——比记录更短的一句观察 */
  function summary(record) {
    var n = record.dimNames;
    if (!n) return "最近的你，开始愿意停下来看看自己。";
    return "最近的你，似乎正在更多地关注：\n" + n + "。";
  }

  window.Record = {
    build: build,
    summary: summary,
    dimWeights: dimWeights,
    topDims: topDims,
    direction: DIRECTION
  };
})();
</script>

<script>
/* =========================================================================
 * 成长空间 · 示例数据
 * -------------------------------------------------------------------------
 * 给「先看看示例」用：一份「用了十来天」的数据，让朋友一打开就能看到
 * 首页有轨迹、成长轨迹有节点、我的画像有内容 —— 而不是一片空状态。
 *
 * 两个关键性质：
 *
 * 1. 它【完全不碰 LocalStorage】。进入示例模式后，Store 的读写都改道到
 *    这个内存对象，用同一个拦截面 —— 所以十个页面自动全部生效，
 *    不需要每个页面各写一份示例逻辑。朋友在示例里点什么都不会留下痕迹，
 *    退出即消失，也绝不会覆盖他自己的真实数据。
 *
 *    附带的好处：iOS 上 localStorage 被禁用时（file:// 下有可能），
 *    示例模式反而是唯一能完整跑起来的部分 —— 因为它本来就不用存储。
 *
 * 2. 日期一律「相对今天」算。不管哪一天打开，看起来都是刚用过的样子。
 *
 * 入口：称呼页和首页空状态的「先看看示例」。退出：顶部那条示例横幅。
 * ========================================================================= */
(function () {
  "use strict";

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function iso(off) {
    var d = new Date(Date.now() - off * 86400000);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function ts(off) { return Date.now() - off * 86400000; }

        id: "demo" + n,

    /* 11 天前：第一次认识自己 —— 整条轨迹的起点 */

    });
    add(9, "mood", "", { moodId: "m3", score: 3, label: "还算平静" });
    add(8, "note", "试着在回消息之前停了三秒。很难，但做到了两次。");
    add(6, "course", "完成课程《看见自己的自动化反应》", {

    add(6, "mood", "", { moodId: "m4", score: 4, label: "还不错" });

    add(0, "mood", "", { moodId: "m5", score: 5, label: "挺好的" });
