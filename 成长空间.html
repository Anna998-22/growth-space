<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="成长空间：一个温和的个人成长小工具。自我观察、情绪、沟通与习惯，每天 10 分钟。">
  <title>成长空间</title>
  <style>
/* =========================================================================
   成长空间 · 样式
   温和、简洁、有一点治愈感；成人向生活方式工具；移动端优先。
   ========================================================================= */

:root{
  --bg:#f5f2ec;
  --card:#ffffff;
  --ink:#2b2925;
  --ink-2:#4a463f;
  --muted:#9b948a;
  --line:#eae3d5;
  --brand:#5f8b77;
  --brand-ink:#3d6551;
  --brand-soft:#e9f1ec;
  --warm:#cf9b74;
  --warm-soft:#f8ece1;
  --radius:18px;
  --shadow:0 10px 26px rgba(80,70,55,.06);
  --maxw:560px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  line-height:1.7;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:var(--ink)}

.hidden{display:none !important}

/* 页面容器：窄列居中，桌面两侧留气氛 */
main#view{
  max-width:var(--maxw);
  margin:0 auto;
  padding:18px 20px 104px;
}
body.no-tab main#view{padding-bottom:36px}

/* ---------- 顶栏 ---------- */
#topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:center;
  height:52px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
#topbar.hidden{display:none}
#pageTitle{font-size:15px;font-weight:600;letter-spacing:.04em}
#btnBack{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:40px;height:40px;font-size:26px;line-height:1;color:var(--ink-2);
}
body.no-bar #topbar{display:none}

/* ---------- 底部导航 ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  max-width:var(--maxw);margin:0 auto;
  display:flex;
  background:color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar.hidden{display:none}
#tabbar .tab{
  flex:1;height:60px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;color:var(--muted);letter-spacing:.03em;
  position:relative;
}
#tabbar .tab::before{
  content:"";width:4px;height:4px;border-radius:50%;
  background:transparent;margin-bottom:2px;
}
#tabbar .tab.on{color:var(--brand-ink);font-weight:600}
#tabbar .tab.on::before{background:var(--brand)}

/* ---------- 轻提示 ---------- */
#toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(8px);
  z-index:60;background:rgba(43,41,37,.88);color:#fff;
  font-size:13px;padding:9px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s ease;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.no-tab #toast{bottom:40px}

/* ---------- 通用 ---------- */
.muted{color:var(--muted)}
.small{font-size:12px}
.center{text-align:center}
.label{
  font-size:12px;letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase;
}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px 18px;
  margin:0 0 14px;
}
.card-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:6px;gap:10px;
}
.card h3{margin:2px 0 6px;font-size:18px;line-height:1.5}
.card .sub,.card p{margin:4px 0}
.meta{font-size:13px;margin:2px 0}
.tag{
  display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;
  background:#f0ece4;color:#8a8376;white-space:nowrap;
}
.tag.live,.tag.ok{background:var(--brand-soft);color:var(--brand-ink)}
.tag.soon{background:#f1eee7;color:#a49c8f}
.page-intro{color:var(--ink-2);font-size:14px;margin:6px 2px 14px}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:46px;padding:0 20px;border-radius:999px;
  font-size:15px;font-weight:600;letter-spacing:.02em;
  transition:transform .08s ease, opacity .15s;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:var(--card);color:var(--brand-ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1;min-width:120px}
.btnrow.center{justify-content:center}
.bigpad{margin-top:6px}
.link{
  color:var(--brand-ink);font-size:14px;padding:6px 2px;font-weight:500;
}
.link.small{font-size:12px;color:var(--muted)}

/* 进度条与统计 */
.bar{height:8px;border-radius:999px;background:#eee7da;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#83a68f);border-radius:999px;transition:width .4s ease}
.bar.mini{margin:10px 0 2px}
.statrow{display:flex;gap:6px;margin-top:12px}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:20px;font-weight:700;letter-spacing:.01em}
.stat span{font-size:11px;color:var(--muted)}

/* ---------- 首页 ---------- */
.hero{
  background:linear-gradient(160deg,var(--brand-soft),#f3ead9);
  border-radius:22px;padding:20px 20px 22px;margin-bottom:16px;
}
.hero-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand-mini{font-size:12px;letter-spacing:.28em;color:var(--brand-ink);font-weight:600}
.streak-chip{
  font-size:12px;color:var(--brand-ink);background:rgba(255,255,255,.65);
  padding:4px 11px;border-radius:999px;
}
.greet{font-size:13px;color:var(--brand-ink);margin:0 0 2px}
.hero-q{font-size:27px;line-height:1.35;margin:0;font-weight:700;letter-spacing:.01em}
.today-card h3{font-size:19px}
.today-card .btn{margin-top:14px}
.today-note{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 6px}
.done-card .big{font-size:15px;color:var(--brand-ink);background:var(--brand-soft);display:inline-block;padding:8px 14px;border-radius:999px;margin-bottom:8px;font-weight:700;letter-spacing:.1em}
.card .pt{font-weight:600;color:var(--ink-2)}

/* ---------- 9 区地图 ---------- */
.zonemap{
  display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(84px,auto);
  gap:9px;
}
.zone-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  text-align:center;padding:8px 6px;color:var(--ink-2);
  text-decoration:none;min-height:84px;
}
.zone-cell.live{
  background:linear-gradient(160deg,#eef4ef,var(--card));
  border-color:#c9dcd2;
}
.zc-name{font-size:13px;font-weight:600;line-height:1.35}
.zc-count{font-size:11px;color:var(--brand-ink);margin-top:2px;font-weight:600}
.zc-status{font-size:10px;color:#b3aca0;margin-top:2px;letter-spacing:.05em}
.zc-status.ok{color:var(--brand)}

/* 区域详情 */
.zone-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.zone-head h2{margin:0;font-size:22px}
.mods{margin:0 0 14px}
.mods .label,.lessons .label{margin:4px 2px 8px}
.mod{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--line);
  padding:12px 14px;border-radius:14px;margin-bottom:8px;font-size:14px;
}
.mod .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}
.mod.soon{color:var(--muted)}
.mod.soon .dot{background:#d8d1c3}
.soon-tag{margin-left:auto;font-size:11px;color:#b3aca0;white-space:nowrap}
.lessons .label{margin-top:6px}
.coming-card{background:var(--warm-soft);border-radius:var(--radius);padding:16px 18px;border:1px solid #f0ddc9}

/* 课程行 */
.lesson-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:13px 14px;margin-bottom:9px;
}
.lesson-row.done{background:#fafaf7;border-color:#e3dfd3}
.lesson-row.done .lr-text b{color:var(--muted)}
.lesson-row .lr-main{display:flex;align-items:center;gap:12px;min-width:0}
.lr-no{
  flex:none;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);
}
.lesson-row.done .lr-no{background:#eef0e6;color:#a6a194}
.lr-text{min-width:0}
.lr-text b{display:block;font-size:15px;line-height:1.4}
.lr-text .small{display:block;margin-top:2px}
.lr-cta{flex:none;font-size:12px;color:var(--brand-ink);font-weight:600}

/* ---------- 学习页 ---------- */
.lesson-head{padding:6px 2px 8px}
.lesson-head h2{font-size:21px;line-height:1.45;margin:8px 0 4px}
.lh-meta{display:flex;align-items:center;gap:8px;font-size:12px}
.ribbon{
  margin:10px 0 4px;font-size:12px;color:var(--brand-ink);
  background:var(--brand-soft);border-radius:999px;padding:6px 12px;display:inline-block;
}
.stepper{display:flex;gap:8px;margin:16px 0 6px}
.stepper .step{display:flex;align-items:center;gap:6px;font-size:12px;color:#b3aca0}
.stepper .step i{
  width:20px;height:20px;border-radius:50%;background:#efe9dc;color:#9f988b;
  font-style:normal;display:flex;align-items:center;justify-content:center;font-size:11px;
}
.stepper .step.on{color:var(--brand-ink)}
.stepper .step.on i,.stepper .step.cur i{background:var(--brand);color:#fff}
.stepper .step.cur{color:var(--brand-ink);font-weight:600}

.reading{font-size:16px;line-height:1.9;color:#33312c}
.body-h{margin:20px 0 4px;font-size:17px;color:var(--ink);letter-spacing:.01em}
.body-p{margin:6px 0;color:#3b3832}
.case{
  background:var(--warm-soft);border:1px solid #f0ddc9;border-left:4px solid var(--warm);
  border-radius:12px;padding:12px 15px;margin:16px 0;
}
.case-tag{display:block;font-size:11px;color:var(--warm);letter-spacing:.12em;margin-bottom:6px;font-weight:600}
.action-bar{margin-top:22px}
.card.finish .tip{margin-top:10px;background:var(--brand-soft);border-radius:12px;padding:11px 13px;font-size:13.5px;color:var(--ink-2)}

/* ---------- 表单 ---------- */
.steps{margin:8px 0 12px;padding-left:20px}
.steps li{margin:5px 0;color:var(--ink-2)}
.field{display:block;margin:14px 0}
.field>span{font-size:13.5px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:6px}
.field .q{font-size:15px;font-weight:600;color:var(--ink)}
.field .hint{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
textarea{
  width:100%;border:1px solid var(--line);background:#fbfaf6;
  border-radius:12px;padding:11px 12px;font-size:14.5px;line-height:1.7;
  resize:vertical;min-height:56px;outline:none;
}
textarea:focus{border-color:#c4d6cb;background:#fff}

/* ---------- 画像 / 状态 ---------- */
.state-text{font-size:15px;line-height:1.85;color:var(--ink-2);margin-top:4px}
.focus-label{margin:10px 0 2px;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.focus-item{margin:3px 0;color:var(--ink-2);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{
  font-size:12.5px;color:var(--brand-ink);background:var(--brand-soft);
  border:1px solid #d6e3da;padding:7px 12px;border-radius:999px;line-height:1.3;
  text-align:left;max-width:100%;
}
.chip.ok{background:var(--brand-soft)}
.smallmt{margin-top:14px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}
.statgrid .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px}
.statgrid .stat b{font-size:19px}

/* 时间线 */
.timeline{list-style:none;margin:6px 0 0;padding:0}
.timeline li{
  display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);
}
.timeline li:last-child{border-bottom:none}
.tl-date{flex:none;width:52px;font-size:11px;color:var(--muted);line-height:1.4;text-align:right}
.tl-date em{display:block;font-style:normal;color:#c6bfb2}
.tl-main{min-width:0;font-size:13.5px}
.tl-main b{font-weight:600;font-size:13.5px;color:var(--ink-2)}
.tl-main .note{margin:2px 0 0;font-size:13px;color:var(--ink-2);white-space:pre-wrap}
.review p{color:var(--ink-2)}

/* ---------- 成长评估 ---------- */
.assess .page-intro{font-size:15px;line-height:1.8}
.assess-top{text-align:center;margin:6px 0 4px}
.assess-top h2{font-size:22px;margin:8px 0 2px}
.scale-legend{
  display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
  margin:6px 2px 14px;
}
.aq{padding-top:16px}
.aq-no{font-size:11px;color:var(--warm);letter-spacing:.2em;margin:0}
.aq-text{font-size:15.5px;font-weight:600;margin:4px 0 12px;line-height:1.6}
.scale{display:flex;gap:6px}
.sc{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 0 6px;border:1px solid var(--line);border-radius:12px;
  background:#fbfaf6;font-size:10px;color:var(--muted);
}
.sc b{font-size:15px;color:var(--ink-2)}
.sc.on{background:var(--brand);border-color:var(--brand)}
.sc.on b,.sc.on span{color:#fff}

@media (min-width:600px){
  body{background:
    radial-gradient(1200px 600px at 15% -10%, #ece8dd 0, transparent 60%),
    var(--bg);}
}
@media (max-width:360px){
  .hero-q{font-size:24px}
  .statgrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

  <!-- 顶栏 -->
  <header id="topbar">
    <button id="btnBack" class="iconbtn back" aria-label="返回" hidden>‹</button>
    <div id="pageTitle">成长空间</div>
  </header>

  <!-- 页面内容 -->
  <main id="view"></main>

  <!-- 底部导航 -->
  <nav id="tabbar">
    <button class="tab" data-nav="home">首页</button>
    <button class="tab" data-nav="route">路线</button>
    <button class="tab" data-nav="course">课程</button>
    <button class="tab" data-nav="practice">练习</button>
    <button class="tab" data-nav="archive">我的</button>
  </nav>

  <!-- 轻提示 -->
  <div id="toast" role="status"></div>

  <!-- 核心层 -->
  <script>
/* =========================================================================
 * 成长空间 · 通用 UI 小工具（无依赖）
 * ========================================================================= */
(function () {
  "use strict";

  function $(s, root) { return (root || document).querySelector(s); }
  function $all(s, root) { return Array.prototype.slice.call((root || document).querySelectorAll(s)); }

  /* 转义，防止用户输入内容被当作 HTML 渲染 */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  /* 本地日期 YYYY-MM-DD */
  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dateToStr(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function dayBefore(str) {
    var d = new Date(str + "T00:00:00");
    d.setDate(d.getDate() - 1);
    return dateToStr(d);
  }
  /* 显示友好日期：今天/昨天/M月d日 */
  function friendlyDate(str) {
    var t = today();
    if (str === t) return "今天";
    if (str === dayBefore(t)) return "昨天";
    var p = str.split("-");
    return parseInt(p[1], 10) + "月" + parseInt(p[2], 10) + "日";
  }
  function friendlyTime(ts) {
    var d = new Date(ts);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  /* 轻提示 */
  var toastTimer = null;
  function toast(msg) {
    var t = $("#toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  window.UI = {
    $: $, $all: $all, el: el, esc: esc,
    today: today, pad: pad, dateToStr: dateToStr, dayBefore: dayBefore,
    friendlyDate: friendlyDate, friendlyTime: friendlyTime, toast: toast
  };
})();
</script>
  <script>
/* =========================================================================
 * 成长空间 · 本地数据层（LocalStorage，key 前缀 gs.）
 * 所有用户数据只保存在当前浏览器里，不联网、不上传。
 * ========================================================================= */
(function () {
  "use strict";

  var PREFIX = "gs.";
  var KEYS = { profile: "profile", progress: "progress", journal: "journal", practices: "practices" };

  function raw(k) { return PREFIX + k; }
  function loadJson(k, def) {
    try {
      var v = JSON.parse(localStorage.getItem(raw(k)));
      return v == null ? def : v;
    } catch (e) { return def; }
  }
  function saveJson(k, v) {
    try { localStorage.setItem(raw(k), JSON.stringify(v)); } catch (e) { /* 隐私/容量异常时静默 */ }
  }

  function getProfile() { return loadJson(KEYS.profile, null); }
  function saveProfile(p) { saveJson(KEYS.profile, p); }

  function progress() { return loadJson(KEYS.progress, {}); }
  function saveProgress(o) { saveJson(KEYS.progress, o); }
  function journal() { return loadJson(KEYS.journal, []); }
  function practices() { return loadJson(KEYS.practices, []); }

  function courseState(id) {
    var p = progress()[id];
    return p ? p.status : "none";
  }
  function isDone(id) { return courseState(id) === "done"; }
  function markStarted(id) {
    var p = progress();
    if (!p[id] || p[id].status !== "done") {
      if (!p[id]) p[id] = { status: "started", startedAt: Date.now() };
    }
    saveProgress(p);
  }

  /* 新增一条成长记录（时间线用）。type: assessment / course / practice */
  function addJournal(type, note, meta) {
    var j = journal();
    var d = new Date();
    j.push({
      id: "j" + d.getTime() + Math.floor(Math.random() * 1000),
      date: UI.today(), ts: d.getTime(), type: type, note: note || "", meta: meta || {}
    });
    j.sort(function (a, b) { return a.ts - b.ts; });
    saveJson(KEYS.journal, j);
  }

  /* 记录一次“今日练习” */
  function addPractice(courseId, note) {
    var arr = practices();
    var d = new Date();
    arr.push({ id: courseId + "-" + d.getTime(), courseId: courseId, note: note || "", date: UI.today(), ts: d.getTime() });
    arr.sort(function (a, b) { return b.ts - a.ts; });
    saveJson(KEYS.practices, arr);
  }

  /* 完成一节课程：写进度 + 练习 + 成长记录 */
  function completeCourse(courseId, payload) {
    payload = payload || {};
    var p = progress();
    p[courseId] = { status: "done", finishedAt: Date.now() };
    saveProgress(p);
    if (!payload.noPractice) addPractice(courseId, payload.practiceNote);
    addJournal("course", "完成课程《" + courseTitle(courseId) + "》", {
      courseId: courseId,
      reflections: payload.reflections || []
    });
  }

  /* 已完成后，再次做练习/反思：只追加记录，不改完成状态 */
  function logSession(courseId, payload) {
    payload = payload || {};
    addPractice(courseId, payload.practiceNote);
    addJournal("practice", "重做练习《" + courseTitle(courseId) + "》", { courseId: courseId });

  <script>
/* =========================================================================
 * 成长空间 · 路由与页面切换
 * 页面由 window.Pages[name] 提供：
 *   { title?, render(params)->html, bind(viewEl, params), hideTab?, hideBar? }
 * 底部 5 个根页面(tab) + 下钻页面(zone/lesson/assess)。
 * ========================================================================= */
(function () {
  "use strict";

  var TABS = ["home", "route", "course", "practice", "archive"];
  var TAB_NAMES = { home: "首页", route: "成长路线", course: "课程", practice: "练习", archive: "我的档案" };

  var state = { tab: "home", stack: [] };

  function isTab(name) { return TAB_NAMES.hasOwnProperty(name); }

  function render(name, params) {
    var page = window.Pages[name];
    if (!page) { name = "home"; page = window.Pages.home; }
    var v = UI.$("#view");
    v.innerHTML = page.render(params || {});
    if (page.bind) page.bind(v, params || {});

    /* 顶栏 */
    var hideBar = !!(page.hideBar || name === "assess");
    var topbar = UI.$("#topbar");
    if (topbar) topbar.classList.toggle("hidden", hideBar);
    UI.$("#btnBack") && UI.$("#btnBack").classList.toggle("hidden", isTab(name));

    var titleEl = UI.$("#pageTitle");
    if (titleEl) {
      var t = (typeof page.title === "function" ? page.title(params) : page.title) || TAB_NAMES[name] || "成长空间";
      titleEl.textContent = t;
    }
    document.body.classList.toggle("no-bar", hideBar);
    document.body.classList.toggle("no-tab", !!(page.hideTab || name === "assess"));

    /* 底部导航 */
    var tabbar = UI.$("#tabbar");
    if (tabbar) {
      var hideTab = !!(page.hideTab || name === "assess");
      tabbar.classList.toggle("hidden", hideTab);
      var btns = UI.$all("#tabbar .tab");
      for (var i = 0; i < btns.length; i++) {
        var active = btns[i].getAttribute("data-nav") === name;
        btns[i].classList.toggle("on", active);
      }
    }
    window.scrollTo(0, 0);
    if (window.afterNav) window.afterNav(name, params);
    state.current = { name: name, params: params || {} };
    return state.current;
  }

  function navigate(name, params) {
    if (isTab(name)) { state.tab = name; state.stack = []; }
    else { state.stack.push({ name: name, params: params || {} }); }
    return render(name, params);
  }

  function back() {
    var target;
    if (state.stack.length) { state.stack.pop(); }
    if (state.stack.length) { var top = state.stack[state.stack.length - 1]; target = top; }
    else { target = { name: state.tab, params: {} }; }
    return render(target.name, target.params);
  }

  function current() { return state.current || { name: state.tab }; }

  function init() {
    UI.$("#btnBack").addEventListener("click", function () { back(); });
    var btns = UI.$all("#tabbar .tab");
    for (var i = 0; i < btns.length; i++) {
      (function (b) {
        b.addEventListener("click", function () { navigate(b.getAttribute("data-nav")); });
      })(btns[i]);
    }
  }

  window.Router = {
    TABS: TABS, TAB_NAMES: TAB_NAMES,
    navigate: navigate, back: back, render: render, init: init, current: current
  };
})();
</script>

  <script>
/* =========================================================================
 * 首页：今天想给自己留 10 分钟吗？→ 今日课程 / 今日练习 / 成长进度
 * ========================================================================= */
(function () {
  "use strict";
  window.Pages = window.Pages || {};

  function statCell(k, v) {
    return '<div class="stat"><b>' + UI.esc(v) + '</b><span>' + k + '</span></div>';
  }

  Pages.home = {
    title: "成长空间",
    render: function () {
      var st = Store.stats();
      var esc = UI.esc;
      var hr = new Date().getHours();
      var greet = hr < 5 ? "夜深了，辛苦了" : hr < 11 ? "早上好" : hr < 14 ? "中午好" : hr < 18 ? "下午好" : "晚上好";
      var recId = Store.nextCourseId();
      var rec = recId ? Course.byId(recId) : null;
      var h = [];

      h.push('<section class="hero">' +
        '<div class="hero-row"><span class="brand-mini">成长空间</span><span class="streak-chip">连续成长 ' + st.streak + ' 天</span></div>' +
        '<p class="greet">' + greet + '</p>' +
        '<h2 class="hero-q">今天，你想给自己<br>留 10 分钟吗？</h2></section>');

      if (rec) {
        var stateLabel = Store.isDone(rec.id) ? "再学一次" : (Store.courseState(rec.id) === "started" ? "继续" : "开始");
        h.push('<section class="card today-card">' +
          '<div class="card-head"><span class="label">今日课程</span></div>' +
          '<h3>' + esc(rec.title) + '</h3>' +
          '<p class="meta muted">预计 ' + rec.minutes + ' 分钟 · 中央区 · 第 ' + rec.order + ' 节</p>' +
          '<p class="sub">' + esc(rec.summary) + '</p>' +
          '<button class="btn primary wide" data-go-lesson="' + rec.id + '">' + stateLabel + '今天的成长</button>' +
          '</section>');

        h.push('<section class="card soft">' +
          '<div class="card-head"><span class="label">今日练习</span></div>' +
          '<p class="pt">' + esc(rec.practice.title) + '</p>' +
          '<button class="link" data-go-lesson="' + rec.id + '">去做练习 →</button>' +
          '</section>');
      } else {
        h.push('<section class="card done-card">' +
          '<div class="big">完成</div>' +
          '<h3>第一阶段 5 节都走完了</h3>' +
          '<p>你已经有“在反应之前先看见它”的能力了。之后可以把练习偶尔带回来重温，也可以去档案里看看自己走过的路。</p>' +
          '<div class="btnrow"><button class="btn ghost" data-go="archive">去看我的档案</button>' +
          '<button class="btn primary" data-assess="1">更新一次状态</button></div></section>');
      }

      var pct = st.coursesTotal ? Math.round(st.coursesDone / st.coursesTotal * 100) : 0;
      h.push('<section class="card">' +
        '<div class="card-head"><span class="label">我的成长进度</span><span class="muted">' + st.coursesDone + ' / ' + st.coursesTotal + ' 节</span></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="statrow">' +
        statCell("课程", st.coursesDone + " / " + st.coursesTotal) +
        statCell("练习", st.practiceDone + " / " + st.coursesTotal) +
        statCell("连续成长", st.streak + " 天") +
        '</div></section>');

      h.push('<p class="today-note">' +
        (st.todayActive ? "今天已经留下成长记录 ☺" : "今天还没有记录——完成今天这节课，就会留下今天的第一笔。") +
        '</p>');

      return h.join("");
    },
    bind: function (v) {
      var els = UI.$all("[data-go-lesson]", v);
      for (var i = 0; i < els.length; i++) els[i].addEventListener("click", goLesson);
      var a = UI.$all("[data-go]", v);
      for (var j = 0; j < a.length; j++) (function (b) {
        b.addEventListener("click", function () { Router.navigate(b.getAttribute("data-go")); });
      })(a[j]);
      var as = UI.$all("[data-assess]", v);
      for (var k = 0; k < as.length; k++) as[k].addEventListener("click", function () {
        Router.navigate("assess", { mode: "redo" });
      });
    }
  };
  function goLesson(e) {
    var id = e.currentTarget.getAttribute("data-go-lesson");
    Store.markStarted(id);
    Router.navigate("lesson", { id: id });
  }
})();
</script>

  };

  <script>
/* =========================================================================
 * 课程学习页：阅读 → 今日练习 → 自我反思 → 完成/保存 → 完成反馈
 * 数据在“完成”那一刻一次性写入（课程进度 + 练习 + 成长记录）。
 * ========================================================================= */
(function () {
  "use strict";
  window.Pages = window.Pages || {};

  var cur = null;          // 当前课程
  var state = null;        // { stage:0..3, note:'', refs:[] }

  function reset(c) {
    cur = c;
    state = { stage: 0, note: "", refs: [], saved: false };
  }

  function bodyHtml(c) {
    var h = [];
    for (var i = 0; i < c.body.length; i++) {
      var b = c.body[i];
      if (b.t === "h") h.push('<h4 class="body-h">' + UI.esc(b.x) + '</h4>');
      else if (b.t === "case") h.push('<div class="case"><span class="case-tag">一个生活里的场景</span><p>' + UI.esc(b.x) + '</p></div>');
      else h.push('<p class="body-p">' + UI.esc(b.x) + '</p>');
    }
    return h.join("");
  }

  /* 顶部进度指示：三个步骤 */
  function stepDots(stage) {
    var labels = ["阅读", "练习", "反思"];
    var h = ['<div class="stepper">'];
    for (var i = 0; i < 3; i++) {
      var cls = i < stage ? "on" : (i === stage ? "cur" : "");
      h.push('<span class="step ' + cls + '"><i>' + (i + 1) + '</i>' + labels[i] + '</span>');
    }
    h.push('</div>');
    return h.join("");
  }

  function draw() {
    var c = cur, s = state;
    var done = Store.isDone(c.id);
    var v = UI.$("#view");
    var h = [];

    /* 头信息 */
    h.push('<div class="lesson-head">');
    h.push('<div class="lh-meta"><span class="tag ok">中央区 · 自我认知与反应</span><span class="muted">预计 ' + c.minutes + ' 分钟</span></div>');
    h.push('<h2>' + UI.esc(c.title) + '</h2>');
    h.push('<p class="sub">' + UI.esc(c.summary) + '</p>');
    if (done && s.stage < 3) h.push('<div class="ribbon">已完成 ✓ · 可以复习，或再做一次练习/反思</div>');
    h.push(stepDots(Math.min(s.stage, 2)));
    h.push('</div>');

    if (s.stage === 0) {
      h.push('<article class="reading">' + bodyHtml(c) + '</article>');
      h.push('<div class="action-bar"><button class="btn primary wide" id="toPractice">我已经读完 → 进入今日练习</button></div>');
    } else if (s.stage === 1) {
      h.push('<section class="card">');
      h.push('<div class="card-head"><span class="label">今日练习</span></div>');
      h.push('<h3>' + UI.esc(c.practice.title) + '</h3>');
      h.push('<ol class="steps">');
      for (var i = 0; i < c.practice.steps.length; i++) h.push('<li>' + UI.esc(c.practice.steps[i]) + '</li>');
      h.push('</ol>');
      h.push('<label class="field"><span>' + UI.esc(c.practice.prompt) + '</span>' +
        '<textarea id="note" rows="4" placeholder="写点什么，或先留白……"></textarea></label>');
      h.push('<button class="btn primary wide" id="savePractice">保存我的练习</button>');
      h.push('</section>');
      h.push('<div class="btnrow center"><button class="link" id="backRead">← 回到课程内容</button></div>');
    } else if (s.stage === 2) {
      h.push('<section class="card">');
      h.push('<div class="card-head"><span class="label">自我反思</span><span class="muted">想写就写，写不下也没关系</span></div>');
      for (var r = 0; r < c.reflections.length; r++) {
        var q = c.reflections[r];
        h.push('<label class="field"><span class="q">' + UI.esc(q.q) + '</span>' +
          (q.hint ? '<span class="hint">' + UI.esc(q.hint) + '</span>' : "") +
          '<textarea data-ref="' + r + '" rows="2" placeholder="写下你的想法……"></textarea></label>');
      }
      var btn = done ? "保存这次的记录" : "完成这节课";
      h.push('<button class="btn primary wide bigpad" id="finishLesson">' + btn + '</button>');
      h.push('</section>');
      h.push('<div class="btnrow center"><button class="link" id="backPractice">← 回到练习</button></div>');
    } else {
      /* stage 3：完成反馈 */
      h.push('<section class="card finish">');
      h.push('<div class="big">完成</div>');
      h.push('<h3>' + (done ? '这节课复习完成' : '这节课完成') + '</h3>');
      h.push('<p class="sub">' + UI.esc(c.feedback.text) + '</p>');
      h.push('<div class="tip"><span>接下来</span>' + UI.esc(c.feedback.tip) + '</div>');
      var next = Course.nextAfter(c.id);
      h.push('<div class="btnrow">');
      h.push('<button class="btn primary" id="goHome">回首页</button>');
      if (next) h.push('<button class="btn ghost" id="goNext">下一节</button>');
      h.push('<button class="btn ghost" id="goArchive">我的档案</button>');
      h.push('</div></section>');
    }

    v.innerHTML = h.join("");
    bind();
    window.scrollTo(0, 0);
  }

  function bind() {
    var s = state;
    var el1 = UI.$("#toPractice", UI.$("#view"));
    if (el1) el1.addEventListener("click", function () { s.stage = 1; draw(); });

    var elB = UI.$("#backRead", UI.$("#view"));
    if (elB) elB.addEventListener("click", function () { s.stage = 0; draw(); });

    var save = UI.$("#savePractice", UI.$("#view"));
    if (save) {
      save.addEventListener("click", function () {
        s.note = UI.$("#note", UI.$("#view")).value.trim();

    }

    var elP = UI.$("#backPractice", UI.$("#view"));
    if (elP) elP.addEventListener("click", function () { s.stage = 1; draw(); });

    /* 反思输入即时同步 */
    var refs = UI.$all("[data-ref]", UI.$("#view"));
    for (var i = 0; i < refs.length; i++) (function (ta) {
      var idx = Number(ta.getAttribute("data-ref"));
      if (s.refs[idx]) ta.value = s.refs[idx];
      ta.addEventListener("input", function () { s.refs[idx] = ta.value.trim(); });
    })(refs[i]);

    var fin = UI.$("#finishLesson", UI.$("#view"));
    if (fin) {
      fin.addEventListener("click", function () {
        fin.disabled = true;
        var done = Store.isDone(cur.id);
        if (done) Store.logSession(cur.id, { practiceNote: s.note });
        else Store.completeCourse(cur.id, { practiceNote: s.note, reflections: s.refs.slice() });
        s.stage = 3;
        draw();
      });
    }

    var home = UI.$("#goHome", UI.$("#view"));
    if (home) home.addEventListener("click", function () { Router.navigate("home"); });
    var nxt = UI.$("#goNext", UI.$("#view"));
    if (nxt) nxt.addEventListener("click", function () {
      var nx = Course.nextAfter(cur.id);
      if (nx) Router.render("lesson", { id: nx.id });

    var arch = UI.$("#goArchive", UI.$("#view"));
    if (arch) arch.addEventListener("click", function () { Router.navigate("archive"); });
  }

  Pages.lesson = {
    hideTab: true,
    title: function (p) {
      var c = Course.byId(p.id);
      return c ? "第 " + c.order + " 节" : "课程";
    },

      var c = Course.byId(p.id) || COURSES[0];

      return '<div class="page-loading">…</div>';
    },
    bind: function () { draw(); }
  };
})();

    else h.push('<p>第一阶段 ' + total + ' 节全部完成了。可以过几天回来复习一遍，也可以重新自评一次，看看自己有没有什么变化。</p>');
    h.push('<div class="btnrow"><button class="btn ghost" data-assess="1">重新自评</button>');
    if (done === 0) h.push('<button class="btn primary" data-go="home">去开始第一课</button>');
    else h.push('<button class="btn primary" data-go="course">回到课程</button>');
    h.push('</div></section>');
    return h.join("");
  }
  function titleByOrder(o) {
    for (var i = 0; i < COURSES.length; i++) if (COURSES[i].order === o) return COURSES[i].title;
    return "";
  }
})();
</script>
  <script>
/* =========================================================================
 * 成长状态自评（整屏）：5 题 × 1–5 档 → 生成画像 → 进入首页 / 返回档案
 * ========================================================================= */
(function () {
  "use strict";
  window.Pages = window.Pages || {};

  function legend() {
    var w = ASSESS.scaleWords;
    return '<div class="scale-legend"><span>' + w[0] + ' ' + 1 + '</span><span class="dim">1 —— 5</span><span>5 ' + w[4] + '</span></div>';
  }

  function formHtml() {
    var h = [];
    h.push('<div class="assess">');
    h.push('<div class="assess-top"><span class="brand-mini">成长空间</span><h2>成长状态自评</h2></div>');
    h.push('<p class="page-intro">' + UI.esc(ASSESS.intro) + '</p>');
    h.push(legend());
    var qs = ASSESS.questions;
    for (var i = 0; i < qs.length; i++) {
      var q = qs[i];
      h.push('<section class="card aq" data-q="' + q.key + '">' +
        '<p class="aq-no">' + (i + 1) + '</p>' +
        '<p class="aq-text">' + UI.esc(q.text) + '</p>' +
        '<div class="scale">');
      for (var n = 1; n <= 5; n++) {
        h.push('<button class="sc" data-v="' + n + '"><b>' + n + '</b><span>' + UI.esc(ASSESS.scaleWord(n)) + '</span></button>');
      }
      h.push('</div></section>');
    }
    h.push('<div class="action-bar"><button class="btn primary wide" id="assessGo" disabled>完成，看看我的成长画像</button></div>');
    h.push('</div>');
    return h.join("");
  }

  function resultHtml(pt, first) {
    var h = [];
    h.push('<div class="assess">');
    h.push('<div class="assess-top"><h2>我的成长画像</h2><p class="muted small">这不是标签，也不是分数，只是此刻的一个起点。</p></div>');
    h.push('<section class="card"><div class="card-head"><span class="label">当前状态</span></div><p class="state-text">' + UI.esc(pt.state) + '</p></section>');
    h.push('<section class="card"><div class="card-head"><span class="label">值得关注的方向</span></div>');
    for (var f = 0; f < pt.focus.length; f++) h.push('<p class="focus-item">· ' + UI.esc(pt.focus[f].text) + '</p>');
    h.push('</section>');
    h.push('<section class="card"><div class="card-head"><span class="label">推荐练习</span></div>');
    h.push('<div class="chips">');
    for (var c = 0; c < pt.recommendIds.length; c++) {
      var cc = Course.byId(pt.recommendIds[c]);
      if (cc) h.push('<button class="chip ok" data-go-lesson="' + cc.id + '">《' + UI.esc(cc.title) + '》</button>');
    }
    h.push('</div></section>');
    h.push('<div class="btnrow">');
    if (first) h.push('<button class="btn primary wide" data-go="home">开始今天的成长 →</button>');
    else h.push('<button class="btn primary wide" data-go="archive">回到我的档案</button>');
    h.push('</div>');
    h.push('</div>');
    return h.join("");
  }

  Pages.assess = {
    hideTab: true,
    hideBar: true,
    title: "成长状态自评",
    render: function () { return formHtml(); },
    bind: function (v, params) {
      var answers = {};
      var cells = UI.$all(".aq", v);
      for (var i = 0; i < cells.length; i++) (function (cell) {
        var qk = cell.getAttribute("data-q");
        var scs = UI.$all(".sc", cell);
        for (var j = 0; j < scs.length; j++) (function (b) {
          b.addEventListener("click", function () {
            var n = b.getAttribute("data-v");
            answers[qk] = n;
            for (var k = 0; k < scs.length; k++) scs[k].classList.toggle("on", scs[k] === b);
            UI.toast(ASSESS.scaleWord(Number(n)));
            if (Object.keys(answers).length === ASSESS.questions.length) UI.$("#assessGo", v).disabled = false;
          });
        })(scs[j]);
      })(cells[i]);

      var go = UI.$("#assessGo", v);
      if (go) go.addEventListener("click", function () {
        go.disabled = true;
        var prev = Store.getProfile();
        var first = !prev;
        var pt = ASSESS.buildPortrait(answers);
        var profile = {
          done: true,
          answers: answers,
          portrait: pt,
          startedAt: prev ? prev.startedAt : Date.now(),
          revisedAt: Date.now()
        };
        Store.saveProfile(profile);
        Store.addJournal("assessment", first ? "完成首次成长状态自评" : "更新成长状态自评", {});
        UI.$("#view").innerHTML = resultHtml(pt, first);
        bindResult();
      });
    }
  };

  function bindResult() {
    var v = UI.$("#view");
    var r = UI.$all("[data-go-lesson]", v);
    for (var i = 0; i < r.length; i++) (function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-go-lesson");
        Store.markStarted(id);
        Router.navigate("lesson", { id: id });
      });
    })(r[i]);
    var g = UI.$all("[data-go]", v);
    for (var j = 0; j < g.length; j++) (function (b) {
      b.addEventListener("click", function () { Router.navigate(b.getAttribute("data-go")); });
    })(g[j]);
    window.scrollTo(0, 0);
  }
})();
</script>
  <!-- 启动 -->
  <script>
/* =========================================================================
 * 成长空间 · 启动与装配
 * 首次进入（无本地画像）→ 成长评估；已有画像 → 首页。
 * ========================================================================= */
(function () {
  "use strict";

  Router.init();

  var prof = Store.getProfile();
  if (prof && prof.done) {
    Router.navigate("home");
  } else {
    Router.render("assess", {});   // 首次进入：整屏成长评估
  }

  /* 调试用：在浏览器控制台执行 devReset() 即可清空本机数据、重新走一遍 */
  window.devReset = function () {
    Store.resetAll();
    location.reload();
  };
})();
</script>
</body>
